<main class="admin-login">
  <section class="login-card" aria-labelledby="admin-login-title">
    <img class="art-layer" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/5e9db.svg" alt="" aria-hidden="true" />
    <img class="art-layer" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/71755.svg" alt="" aria-hidden="true" />
    <img class="art-layer" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/ceb24.svg" alt="" aria-hidden="true" />
    <img class="art-layer" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/93096.svg" alt="" aria-hidden="true" />

    <img
      class="mascot-art"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/ad088.png"
      alt=""
      aria-hidden="true"
    />

    <img class="art-layer art-layer--foreground" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/e0bb6.svg" alt="" aria-hidden="true" />

    <img
      class="paw-art paw-art--left"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/004b7.png"
      alt=""
      aria-hidden="true"
    />
    <img
      class="paw-art paw-art--right"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/21d00.png"
      alt=""
      aria-hidden="true"
    />

    <img
      class="botanical-art"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/c3394.svg"
      alt=""
      aria-hidden="true"
    />

    <img
      class="leaf-overlay leaf-overlay--upper"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/5a693.svg"
      alt=""
      aria-hidden="true"
    />
    <img
      class="leaf-overlay leaf-overlay--lower"
      src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/5a693.svg"
      alt=""
      aria-hidden="true"
    />

    <img class="art-layer art-layer--marks" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/14d1d.svg" alt="" aria-hidden="true" />

    <section class="brand-identity" aria-label="Dr. Pet's House">
      <img
        class="brand-logo"
        src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/a7e9d.png"
        alt="Dr. Pet's House"
      />
      <div class="brand-accent" aria-hidden="true"></div>
      <p class="brand-copy">Chỉn chu để chăm sóc<br />tốt hơn</p>
    </section>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <header class="login-heading">
        <div class="login-heading__accent" aria-hidden="true"></div>
        <p class="login-heading__eyebrow">ADMIN PORTAL</p>
        <h1 id="admin-login-title">Chào mừng trở lại!</h1>
      </header>

      <div class="field-group">
        <label class="field" [class.field--invalid]="showError('identifier')">
          <img class="field__icon" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/ae550.svg" alt="" aria-hidden="true" />
          <input
            type="text"
            inputmode="tel"
            autocomplete="username"
            placeholder="Số điện thoại"
            formControlName="identifier"
            aria-label="Số điện thoại"
          />
        </label>
        @if (showError('identifier')) {
          <p class="field-error">Vui lòng nhập số điện thoại.</p>
        }

        <label class="field" [class.field--invalid]="showError('password')">
          <img class="field__icon" src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/926e4.svg" alt="" aria-hidden="true" />
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Mật khẩu"
            formControlName="password"
            aria-label="Mật khẩu"
          />
          <button
            class="visibility-button"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordVisible() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <img src="https://www.figma.com/api/mcp/asset/18eb7ebc-13fa-4e50-b84b-f14622e7a8a7/b47f1.svg" alt="" aria-hidden="true" />
          </button>
        </label>
        @if (showError('password')) {
          <p class="field-error">Mật khẩu phải có ít nhất 8 ký tự.</p>
        }
      </div>

      <button class="login-button" type="submit">Đăng nhập</button>
    </form>
  </section>
</main>
