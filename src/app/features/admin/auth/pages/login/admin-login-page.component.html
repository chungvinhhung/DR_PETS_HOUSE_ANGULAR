<main class="admin-login">
  <section class="login-card" aria-labelledby="admin-login-title">
    <img class="art-layer" src="/assets/admin-login/blue-edge.png" alt="" aria-hidden="true" />
    <img class="art-layer" src="/assets/admin-login/navy-panel.png" alt="" aria-hidden="true" />
    <img class="art-layer" src="/assets/admin-login/corner-curves.png" alt="" aria-hidden="true" />
    <img class="art-layer" src="/assets/admin-login/sun.png" alt="" aria-hidden="true" />

    <div class="mascot-frame" aria-hidden="true">
      <img
        class="mascot-art"
        src="/assets/admin-login/mascot.png"
        alt=""
      />
    </div>

    <img class="art-layer art-layer--foreground" src="/assets/admin-login/foreground-wave.png" alt="" aria-hidden="true" />

    <div class="paw-frame paw-frame--left" aria-hidden="true">
      <img
        class="paw-art"
        src="/assets/admin-login/paw-left.png"
        alt=""
      />
    </div>
    <div class="paw-frame paw-frame--right" aria-hidden="true">
      <img
        class="paw-art"
        src="/assets/admin-login/paw-right.png"
        alt=""
      />
    </div>

    <img
      class="botanical-art"
      src="/assets/admin-login/botanical.png"
      alt=""
      aria-hidden="true"
    />

    <div class="leaf-frame leaf-frame--upper" aria-hidden="true">
      <img
        class="leaf-overlay"
        src="/assets/admin-login/leaf-upper.png"
        alt=""
      />
    </div>
    <div class="leaf-frame leaf-frame--lower" aria-hidden="true">
      <img
        class="leaf-overlay"
        src="/assets/admin-login/leaf-lower.png"
        alt=""
      />
    </div>

    <img class="art-layer art-layer--marks" src="/assets/admin-login/marks.png" alt="" aria-hidden="true" />

    <section class="brand-identity" aria-label="Dr. Pet's House">
      <img
        class="brand-logo"
        src="/assets/admin-login/logo.png"
        alt="Dr. Pet's House"
      />
      <div class="brand-accent" aria-hidden="true"></div>
      <p class="brand-copy">Chỉn chu để chăm sóc<br />tốt hơn</p>
    </section>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <header class="login-heading">
        <div class="login-heading__accent" aria-hidden="true"></div>
        <p class="login-heading__eyebrow">ADMIN PORTAL</p>
        <h1 id="admin-login-title">Chào mừng trở lại!</h1>
      </header>

      <div class="field-group">
        <label class="field" [class.field--invalid]="showError('identifier')">
          <img class="field__icon" src="/assets/admin-login/phone.png" alt="" aria-hidden="true" />
          <input
            type="text"
            inputmode="tel"
            autocomplete="username"
            placeholder="Số điện thoại"
            formControlName="identifier"
            aria-label="Số điện thoại"
          />
        </label>
        @if (showError('identifier')) {
          <p class="field-error">Vui lòng nhập số điện thoại.</p>
        }

        <label class="field" [class.field--invalid]="showError('password')">
          <img class="field__icon" src="/assets/admin-login/lock.png" alt="" aria-hidden="true" />
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Mật khẩu"
            formControlName="password"
            aria-label="Mật khẩu"
          />
          <button
            class="visibility-button"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordVisible() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <img src="/assets/admin-login/visibility.png" alt="" aria-hidden="true" />
          </button>
        </label>
        @if (showError('password')) {
          <p class="field-error">Mật khẩu phải có ít nhất 8 ký tự.</p>
        }
      </div>

      @if (apiError()) {
        <p class="login-error" role="alert">{{ apiError() }}</p>
      }

      <button class="login-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>
  </section>
</main>
