<!-- Checkbox -->
<button
  type="button"
  (click)="handle1($any($event))"
  class="flex h-[40px] w-6 shrink-0 cursor-pointer items-center justify-center transition-transform duration-micro hover:scale-110 focus-ring-brand"
  [attr.aria-label]="item().selected ? 'Bỏ chọn sản phẩm' : 'Chọn sản phẩm'"
  [attr.aria-pressed]="item().selected"
>
  @if (item().selected) {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="18" height="18" rx="3" fill="#0D47A1" />
      <path
        d="M9 12L11 14L15 10"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  } @else {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="18" height="18" rx="3" stroke="#0D47A1" stroke-width="1.5" fill="white" />
    </svg>
  }
</button>
<!-- Product image -->
<div class="flex h-full shrink-0 items-center justify-center">
  <div class="h-[64px] w-[64px] lg:h-[92px] lg:w-[92px]">
    <img
      [attr.src]="item().image || item().imageUrl || item().thumbnail || cartImages.productThumb"
      [attr.alt]="item().name"
      class="size-full object-cover"
    />
  </div>
</div>
<!-- Product info -->
<div class="flex min-w-0 flex-1 flex-col justify-center gap-[8px] lg:gap-[12px]">
  <div class="flex w-full items-start justify-between">
    <p class="line-clamp-2 min-w-0 pr-3 font-['Roboto'] text-[12px] font-bold leading-[1.43] tracking-[0.17px] text-[#0d47a1] lg:text-[14px]">{{ item().name }}</p>
    <button
      type="button"
      (click)="handle2($any($event))"
      class="group relative h-[15px] w-[14px] shrink-0 transition-all duration-micro hover:scale-110 focus-ring-brand lg:h-5 lg:w-[17px]"
      aria-label="Xóa sản phẩm"
    >
      <img
        [attr.src]="cartImages.iconBin"
        alt=""
        class="size-full transition-colors duration-micro group-hover:brightness-0 group-hover:invert-[0.2] group-hover:sepia-[0.3] group-hover:saturate-[5] group-hover:hue-rotate-[-30deg]"
      />
    </button>
  </div>
  <div class="flex w-full items-center justify-between text-[#353535]">
    <p class="shrink-0 whitespace-nowrap font-['Roboto'] text-[12px] font-bold leading-[1.43] tracking-[0.17px] lg:text-[14px]">{{ formatPrice(item().price) }}</p>
    <!-- Quantity stepper -->
    <div class="flex h-5 w-14 shrink-0 items-center justify-between rounded border border-solid border-[#353535] px-2 font-['Josefin_Sans'] text-[20px] font-medium leading-normal lg:h-[27px] lg:w-[78px] lg:px-[16px] lg:py-[5px]">
      <button
        type="button"
        (click)="handle3($any($event))"
        class="flex h-5 w-3 shrink-0 items-center justify-center text-[20px] leading-5 text-[#353535] transition-colors duration-micro hover:text-[#0d47a1] active:scale-90 focus-ring-brand lg:h-6 lg:w-6"
        aria-label="Giảm số lượng"
      >−</button>
      <span class="shrink-0 text-[13px] leading-5 text-[#353535] lg:text-[20px]">{{ item().qty }}</span>
      <button
        type="button"
        (click)="handle4($any($event))"
        class="flex h-5 w-3 shrink-0 items-center justify-center text-[20px] leading-5 text-[#353535] transition-colors duration-micro hover:text-[#0d47a1] active:scale-90 focus-ring-brand lg:h-6 lg:w-6"
        aria-label="Tăng số lượng"
      >+</button>
    </div>
  </div>
  <div class="flex w-full flex-wrap items-center gap-x-4 gap-y-2 font-['Roboto'] text-[10px] leading-[1.66] tracking-[0.4px] text-[#353535] lg:gap-x-6 lg:text-[12px]">
    <div class="flex items-center gap-[5px] lg:gap-[8px]">
      <span>Loại:</span>
      @if (variantOptions().length > 1) {
        <select
          [selectValue]="compute5()"
          (change)="handleVariantChange($any($event))"
          (click)="stopCardNavigation($any($event))"
          class="h-[22px] max-w-[86px] rounded border border-[#c7c7c7] bg-white px-1 text-[10px] text-[#353535] outline-none transition-colors focus:border-[#0d47a1] lg:max-w-[112px] lg:text-[12px]"
          aria-label="Chọn loại sản phẩm"
        >
          @for (variant of variantOptions(); track $index) {
            <option [value]="compute6(variant) ?? ''">{{ variant.name }}</option>
          }
        </select>
      } @else {
        <span>{{ item().type || selectedVariant()?.name || 'Mặc định' }}</span>
      }
    </div>
    <div class="flex items-center gap-[5px] lg:gap-[8px]">
      <span>Kích cỡ:</span>
      @if (sizeOptions().length > 1) {
        <select
          [selectValue]="item().size || ''"
          (change)="handleSizeChange($any($event))"
          (click)="stopCardNavigation($any($event))"
          class="h-[22px] max-w-[86px] rounded border border-[#c7c7c7] bg-white px-1 text-[10px] text-[#353535] outline-none transition-colors focus:border-[#0d47a1] lg:max-w-[112px] lg:text-[12px]"
          aria-label="Chọn kích cỡ sản phẩm"
        >
          @for (size of sizeOptions(); track size) {
            <option [value]="size ?? ''">{{ size || 'Mặc định' }}</option>
          }
        </select>
      } @else {
        <span>{{ item().size || sizeOptions()[0] || 'Mặc định' }}</span>
      }
    </div>
  </div>
</div>
