@if (!(!cartService.isCartOpen())) {
  <div class="cart-drawer__overlay" role="presentation">
    <button
      type="button"
      class="pointer-events-auto absolute inset-0 top-[88px] hidden bg-transparent lg:block"
      (click)="cartService.closeCart()"
      aria-label="Đóng giỏ hàng"
    ></button>
    <div class="cart-drawer__layer">
      <aside app-my-cart-panel (onClose)="cartService.closeCart()"></aside>
    </div>
  </div>
}
