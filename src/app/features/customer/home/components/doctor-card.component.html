<div class="relative h-[312px] w-[312px]">
  <!-- Ellipse vàng 1 -->
  <svg
    class="absolute left-[26px] top-[88px] z-0 h-[148px] w-[223px]"
    viewBox="0 0 223 148"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <ellipse
      cx="122.679"
      cy="52.1324"
      rx="122.679"
      ry="52.1324"
      transform="matrix(0.890114 -0.455738 0.390902 0.920433 -18.4736 81.604)"
      fill="#FDD835"
    />
  </svg>
  <!-- Ellipse vàng 2 -->
  <svg
    class="absolute left-[62px] top-[126px] z-0 h-[147px] w-[223px]"
    viewBox="0 0 223 147"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <ellipse
      cx="122.679"
      cy="51.5191"
      rx="122.679"
      ry="51.5191"
      transform="matrix(0.890114 -0.455738 0.390902 0.920433 -18.2778 81.8022)"
      fill="#FDD835"
    />
  </svg>
  <!-- Bác sĩ -->
  <img
    [attr.src]="image()"
    [attr.alt]="name()"
    class="relative z-10 -translate-y-14 h-[312.42px] w-[312.42px] object-contain object-bottom"
  />
  <!-- Nền xanh tên bác sĩ -->
  <div class="absolute bottom-[0px] left-1/2 z-20 h-[131px] w-[318px] -translate-x-1/2">
    <img [attr.src]="homeImages.doctorNameBg" alt="" class="h-full w-full object-contain" aria-hidden="true" />
    <p class="absolute left-1/2 top-1/2 flex h-[27px] w-[204px] -translate-x-1/2 -translate-y-1/2 rotate-[-13.69deg] items-center justify-center text-center font-roboto text-[20px] font-medium leading-[160%] tracking-[0.15px] text-secondary">{{ name() }}</p>
  </div>
</div>
