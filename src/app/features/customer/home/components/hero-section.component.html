<div class="relative mx-auto w-[95%] max-w-[1300px]">
  <!-- Background xanh -->
  <div class="
          absolute inset-0
          h-[580px]
          rounded-[70px]
          bg-[#E5F6FD]
          shadow-[inset_0_0_20px_rgba(126,128,133,0.25)]
        "></div>
  <!-- Content -->
  <div class="
          relative z-10
          flex min-h-[560px] flex-col items-center justify-between
          gap-10 px-8
          lg:flex-row lg:px-[100px]
        ">
    <!-- LEFT -->
    <div class="max-w-[500px] self-center">
      <p class="mb-0 text-xl font-bold text-black/80">Trung Tâm Chăm Sóc Thú Cưng</p>
      <img [attr.src]="homeImages.heroLogo" alt="Dr.Pet's House" class="mb-5 w-full max-w-[600px]" />
      <p class="mb-8 text-xl leading-relaxed text-slate-800">Chúng tôi mang đến dịch vụ y tế chuẩn xác, không gian spa thư giãn và những sản phẩm chất lượng nhất cho người bạn bốn chân của bạn.</p>
      <div class="flex gap-5">
        <div class="group relative">
          <img
            [attr.src]="homeImages.paw"
            alt=""
            class="
                  pointer-events-none absolute
                  left-[-54px] top-[-43px]
                  h-[70px] w-[60px]
                  -rotate-[25deg]
                  opacity-0 translate-y-2
                  transition-all duration-300
                  group-hover:opacity-100 group-hover:translate-y-0
                "
          />
          <app-yellow-button [to]="'/dat-lich'">ĐẶT LỊCH NGAY</app-yellow-button>
        </div>
        <app-yellow-button [to]="'/cua-hang'" [variant]="'light'">MUA SẮM NGAY</app-yellow-button>
      </div>
    </div>
    <!-- RIGHT -->
    <div class="relative h-[650px] w-[520px] shrink-0">
      <!-- Ellipse -->
      <div class="
              absolute bottom-[59px] left-1/2
              h-[460px] w-[470px]
              -translate-x-1/2
              rounded-full
              bg-[#90CAF9]
              shadow-[0_4px_20px_rgba(0,0,0,0.25)]
            "></div>
      <!-- Shape -->
      <svg
        class="absolute right-[80px] top-[90px] z-20"
        width="60"
        height="72"
        viewBox="0 0 60 72"
        fill="none"
      >
        <path d="M13 54C22 45 27 33 30 19" stroke="#2B1B1B" stroke-width="7" stroke-linecap="round" />
        <path d="M35 58C43 49 49 36 52 24" stroke="#2B1B1B" stroke-width="7" stroke-linecap="round" />
      </svg>
      <!-- Pets -->
      <img
        [attr.src]="homeImages.heroPets"
        alt="Pets"
        class="
              absolute bottom-[-40px] left-1/2
              z-10
              w-[390px]
              -translate-x-1/2
              object-contain
            "
      />
    </div>
  </div>
</div>
