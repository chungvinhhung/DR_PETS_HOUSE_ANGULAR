<div class="hero-section__box">
  <!-- Background xanh -->
  <div class="hero-section__background-xanh"></div>
  <!-- Content -->
  <div class="hero-section__content">
    <!-- LEFT -->
    <div class="hero-section__left">
      <p class="hero-section__trung-tam-cham-text">Trung Tâm Chăm Sóc Thú Cưng</p>
      <img [attr.src]="homeImages.heroLogo" alt="Dr.Pet's House" class="hero-section__dr-pet-s-house" />
      <p class="hero-section__chung-toi-mang-text">Chúng tôi mang đến dịch vụ y tế chuẩn xác, không gian spa thư giãn và những sản phẩm chất lượng nhất cho người bạn bốn chân của bạn.</p>
      <div class="hero-section__row">
        <div class="hero-section__box-2 group">
          <img
            [attr.src]="homeImages.paw"
            alt=""
            class="hero-section__paw group-hover:opacity-100 group-hover:translate-y-0 -rotate-[25deg] opacity-0 translate-y-2"
          />
          <app-yellow-button [to]="'/dat-lich'">ĐẶT LỊCH NGAY</app-yellow-button>
        </div>
        <app-yellow-button [to]="'/cua-hang'" [variant]="'light'">MUA SẮM NGAY</app-yellow-button>
      </div>
    </div>
    <!-- RIGHT -->
    <div class="hero-section__right">
      <!-- Ellipse -->
      <div class="hero-section__ellipse"></div>
      <!-- Shape -->
      <svg
        class="hero-section__shape"
        width="60"
        height="72"
        viewBox="0 0 60 72"
        fill="none"
      >
        <path d="M13 54C22 45 27 33 30 19" stroke="#2B1B1B" stroke-width="7" stroke-linecap="round" />
        <path d="M35 58C43 49 49 36 52 24" stroke="#2B1B1B" stroke-width="7" stroke-linecap="round" />
      </svg>
      <!-- Pets -->
      <img
        [attr.src]="homeImages.heroPets"
        alt="Pets"
        class="hero-section__pets"
      />
    </div>
  </div>
</div>
