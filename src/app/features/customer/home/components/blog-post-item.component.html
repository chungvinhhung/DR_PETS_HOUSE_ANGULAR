<a
  [appCustomerLink]="`/blog/${post().id}`"
  [class]="`group block rounded-[10px] px-9 py-8 transition-all hover:-translate-y-0.5 hover:shadow-md ${
        highlighted() ? 'bg-[#E3F2FD]' : 'bg-white'
      }`"
>
  <p class="blog-post-item__text">
    <app-category-icon [category]="post().category" [className]="'h-3 w-3'" />{{ post().categoryLabel }}</p>
  <h3 class="blog-post-item__title group-hover:text-[#0D47A1] text-[#232536]">{{ post().title }}</h3>
  <p class="blog-post-item__text-2">
    <app-customer-icon name="calendar-days" className="h-3.5 w-3.5" />{{ post().publishedAt }}</p>
</a>
