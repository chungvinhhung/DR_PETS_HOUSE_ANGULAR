<label class="flex h-[52px] min-w-0 flex-1 items-center justify-between rounded-[42px] border border-[rgba(25,118,210,0.5)] bg-white/80 py-2 pl-5 pr-2">
  <input
    type="text"
    placeholder="Tìm kiếm theo tên thú cưng hoặc giống"
    [value]="searchInput() ?? ''"
    (input)="onSearchInputChange.emit($any($event).target.value)"
    class="min-w-0 flex-1 bg-transparent text-[15px] text-[#5f5f5f] outline-none placeholder:text-[#5f5f5f]"
  />
  @if (searchInput()) {
    <button
      type="button"
      (click)="onClearSearch.emit($event)"
      class="mr-3 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#E3F2FD] text-[28px] font-semibold leading-none text-[#0D47A1] transition-colors hover:bg-[#BBDEFB]"
      aria-label="Xóa tìm kiếm hồ sơ"
    >×</button>
  }
  <button
    type="submit"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full transition-colors hover:bg-[#fff176]"
    aria-label="Tìm kiếm hồ sơ"
  >
    <img [attr.src]="appointmentImages.searchIcon" alt="" class="h-7 w-7" />
  </button>
</label>
<label class="flex h-[52px] w-[180px] cursor-pointer items-center gap-[8px] rounded-[42px] border border-[rgba(25,118,210,0.5)] bg-white px-[14px]">
  <svg class="h-4 w-[18px] shrink-0 text-[#414141]" viewBox="0 0 18 12" aria-hidden="true">
    <path d="M1 1h16M1 6h10M1 11h5" stroke="currentColor" stroke-width="1.5" />
  </svg>
  <select
  [selectValue]="sortBy()"
  (change)="onSortChange.emit($any($event.target).value)"
    class="w-full cursor-pointer appearance-none bg-transparent text-center text-[14px] font-medium outline-none"
    aria-label="Sắp xếp thú cưng"
  >
    @for (option of PET_SORT_OPTIONS; track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
