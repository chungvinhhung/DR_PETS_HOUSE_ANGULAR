<div class="flex items-center gap-3">
  <div class="w-8 h-8 flex items-center justify-center bg-red-100 text-red-500 rounded">
    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm5 0h-2V8h2v8z" />
    </svg>
  </div>
  <div>
    <p class="text-xs font-semibold text-slate-800">{{ fileName() }}</p>
    <p class="text-[10px] text-slate-500 mt-0.5">{{ size() }}</p>
  </div>
</div>
<div class="flex items-center gap-2 text-slate-500">
  <button
    type="button"
    (click)="onEdit.emit($event)"
    class="p-1.5 hover:text-yellow-600 bg-white shadow-sm border border-slate-100 rounded-md transition"
    title="Chỉnh sửa tệp"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
      />
    </svg>
  </button>
  <button
    type="button"
    (click)="onDownload.emit($event)"
    class="p-1.5 hover:text-blue-600 bg-white shadow-sm border border-slate-100 rounded-md transition"
    title="Tải xuống tệp"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
      />
    </svg>
  </button>
  <button
    type="button"
    (click)="onDelete.emit($event)"
    class="p-1.5 hover:text-red-600 bg-white shadow-sm border border-slate-100 rounded-md transition"
    title="Xóa tệp"
  >
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
      />
    </svg>
  </button>
</div>
