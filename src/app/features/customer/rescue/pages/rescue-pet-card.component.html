<div class="rescue-pet-card__box"></div>
<div class="rescue-pet-card__box-2">
  <div class="rescue-pet-card__box-3">
    <img [attr.src]="pet().image" [attr.alt]="pet().name" class="rescue-pet-card__name" />
  </div>
</div>
@if (adopted()) {
  <div class="rescue-pet-card__layer">
    <app-customer-icon name="circle" className="h-[11px] w-[11px] fill-white" />{{ pet().ribbon }}</div>
} @else {
  <div class="rescue-pet-card__ribbon">{{ pet().ribbon }}</div>
}
<div class="rescue-pet-card__stack">
  <p class="rescue-pet-card__description">{{ pet().description }}</p>
  <div class="rescue-pet-card__box-4">
    <h3 class="rescue-pet-card__tinh-trang-title">Tình trạng</h3>
    <p class="rescue-pet-card__status">{{ pet().status }}</p>
  </div>
  <div class="rescue-pet-card__box-5">
    <h3 class="rescue-pet-card__tinh-trang-title">Cần hỗ trợ</h3>
    <p class="rescue-pet-card__need">{{ pet().need }}</p>
  </div>
  @if (!adopted()) {
    <div class="rescue-pet-card__stack-2">
      <button
        type="button"
        (click)="onAdopt.emit(pet())"
        class="flex h-9 items-center justify-center rounded-[2px] bg-[#FDD835] text-[14px] leading-5 tracking-[0.28px] text-[rgba(0,0,0,0.87)] shadow-[0_1px_1px_rgba(0,0,0,0.05)] transition-colors hover:bg-[#FBC02D]"
      >Nhận nuôi ngay</button>
      @if (pet().supportPartnerHref) {
        <a
          [href]="pet().supportPartnerHref" target="_blank" rel="noopener noreferrer"
          [attr.aria-label]="'Liên hệ '+pet().supportPartnerName+' để hỗ trợ'"
          class="rescue-pet-card__lien-he-de-button flex h-[38px] items-center justify-center"
        >Liên hệ để hỗ trợ</a>
      } @else {
        <button type="button" (click)="onAdopt.emit(pet())" class="rescue-pet-card__lien-he-de-button">Liên hệ để hỗ trợ</button>
      }
    </div>
  }
</div>
