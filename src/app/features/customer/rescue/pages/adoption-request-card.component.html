<img
  [attr.src]="request().petImage || rescueImages.rescuePlaceholder"
  [attr.alt]="request().petName"
  class="adoption-request-card__pet-name"
/>
<div class="adoption-request-card__stack">
  <div class="adoption-request-card__row">
    <h3 class="adoption-request-card__pet-name-2">{{ request().petName }}</h3>
    <span [class]="`rounded-full px-3 py-1 text-[12px] font-bold ${badgeClass()}`">{{ request().statusLabel }}</span>
  </div>
  @if (request().reason) {
    <p class="adoption-request-card__reason">{{ request().reason }}</p>
  }
  <p class="adoption-request-card__submitted-date">
    @if (submittedDate()) {
      {{ `Gửi đơn ngày ${submittedDate()}` }}
    } @else {
      Đơn nhận nuôi đã được ghi nhận.
    }
  </p>
</div>
