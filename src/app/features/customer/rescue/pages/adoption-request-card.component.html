<img
  [attr.src]="request().petImage || rescueImages.rescuePlaceholder"
  [attr.alt]="request().petName"
  class="h-24 w-24 shrink-0 rounded-[18px] object-cover"
/>
<div class="flex min-w-0 flex-1 flex-col gap-2">
  <div class="flex flex-wrap items-center gap-3">
    <h3 class="text-[22px] font-bold leading-7 text-[#111827]">{{ request().petName }}</h3>
    <span [class]="`rounded-full px-3 py-1 text-[12px] font-bold ${badgeClass()}`">{{ request().statusLabel }}</span>
  </div>
  @if (request().reason) {
    <p class="line-clamp-2 text-[14px] leading-5 text-[#475569]">{{ request().reason }}</p>
  }
  <p class="text-[13px] leading-5 text-[#64748B]">
    @if (submittedDate()) {
      {{ `Gửi đơn ngày ${submittedDate()}` }}
    } @else {
      Đơn nhận nuôi đã được ghi nhận.
    }
  </p>
</div>
