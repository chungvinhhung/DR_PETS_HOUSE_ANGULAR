<div class="partner-card__stack">
  <div class="partner-card__row">
    <img
      [attr.src]="partner().image"
      [attr.alt]="partner().name"
      class="partner-card__name"
    />
    <div class="partner-card__stack-2">
      <a
        [attr.href]="partner().href"
        target="_blank"
        rel="noreferrer"
        class="partner-card__name-2"
      >{{ partner().name }}</a>
      <div class="partner-card__row-2">
        <app-customer-icon name="map-pin" className="h-[15px] w-3 shrink-0" />
        <span class="partner-card__region">{{ partner().region }}</span>
      </div>
    </div>
  </div>
  <div class="partner-card__stack-3">
    <p class="partner-card__address">{{ partner().address }}</p>
    <div class="partner-card__box">
      @for (line of description(); track line) {
        <p>{{ line }}</p>
      }
    </div>
  </div>
  <div class="partner-card__row-3">
    <button class="partner-card__button">
      <app-customer-icon name="phone" className="h-[13.5px] w-[13.5px]" />Gọi ngay</button>
    <a
      [attr.href]="partner().href"
      target="_blank"
      rel="noreferrer"
      class="partner-card__link"
    >
      <app-customer-icon name="link" className="h-[13.5px] w-[13.5px]" />Ghé thăm</a>
  </div>
</div>
