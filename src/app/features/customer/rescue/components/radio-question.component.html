<legend class="text-[18px] font-medium leading-7 text-[rgba(0,0,0,0.87)]">{{ question().label }}@if (question().required) {
    <span app-required-mark></span>
  }
</legend>
<div [class]="question().compact
          ? 'flex w-full items-start justify-between gap-4'
          : question().columns === 2
            ? 'grid w-full grid-cols-2 gap-4'
            : 'flex w-full flex-col gap-4'">
  @for (option of question().options; track option) {
    <label
      app-radio-pill
      [question]="question()"
      [option]="option"
      [checked]="value() === option"
      (onChange)="onChange.emit($event)"
      [framed]="framed()"
      [invalid]="invalid()"
    ></label>
  }
</div>
<app-field-error [show]="invalid()" />
