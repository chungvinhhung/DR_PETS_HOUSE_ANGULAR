<div
  class="step-progress__layer"
  [appStyle]="{ width: `${((stepIndex() + 1) / ADOPTION_STEPS.length) * 100}%` }"
></div>
@for (step of ADOPTION_STEPS; track $index; let index = $index) {
  @let completed = index < stepIndex();
  @let active = index === stepIndex();
  <div class="step-progress__row">
    <div [class]="`flex h-10 w-10 items-center justify-center rounded-full text-[16px] font-bold leading-6 ${
              completed ? 'bg-[#0058BE]' : active ? 'bg-[#FDD835]' : 'bg-[#D9E3F6]'
            }`">
      @if (completed) {
        <app-customer-icon name="check" className="h-[14px] w-[14px] text-white" [strokeWidth]="3" />
      } @else {
        <span>{{ index + 1 }}</span>
      }
    </div>
    <span class="step-progress__label">{{ step.label }}</span>
  </div>
}
