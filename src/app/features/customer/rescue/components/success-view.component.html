<div class="success-view__stack">
  <img src="/src/assets/images/checkout/success-icon.svg" alt="" class="success-view__image" />
  <div class="success-view__stack-2">
    <h2 class="success-view__title">{{ ADOPTION_SUCCESS.title }}</h2>
    <p class="success-view__description">{{ ADOPTION_SUCCESS.description }}</p>
  </div>
  <div class="success-view__row">
    <app-modal-button (onClick)="handle1()" [className]="'font-bold'">Trở về trang chủ</app-modal-button>
    <app-modal-button [variant]="'outline'" (onClick)="onClose.emit($event)" [className]="'shadow-none'">Xem tiếp các bé khác</app-modal-button>
  </div>
  <div class="success-view__row-2">
    <app-customer-icon name="phone" className="mr-2 h-[10.5px] w-[10.5px] text-[#0D47A1]" [strokeWidth]="2" />
    <span class="success-view__neu-co-thac-text">Nếu có thắc mắc, liên hệ hotline:</span>
    <strong class="success-view__hotline">{{ ADOPTION_SUCCESS.hotline }}</strong>
  </div>
</div>
