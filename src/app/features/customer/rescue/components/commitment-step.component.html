@for (question of COMMITMENT_QUESTIONS; track $index) {
  @if (question.type === 'textarea') {
    <div
      app-textarea-question
      [question]="question"
      [value]="values()[question.name]"
      (onChange)="onChange.emit($event)"
      [error]="errors().includes(question.name)"
    ></div>
  } @else {
    <fieldset
      app-radio-question
      [question]="question"
      [value]="values()[question.name]"
      (onChange)="onChange.emit($event)"
      [error]="errors().includes(question.name)"
    ></fieldset>
  }
}
<div class="commitment-step__row">
  <app-customer-icon
    name="alert-triangle"
    className="h-[26px] w-[18px] shrink-0 text-[#BA1A1A]"
    [strokeWidth]="2"
  />
  <p class="commitment-step__adoption-commitment-note">{{ ADOPTION_COMMITMENT_NOTE }}</p>
</div>
