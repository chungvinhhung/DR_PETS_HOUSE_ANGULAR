<div class="filter-group__row">
  <div class="filter-group__box"></div>
  <h3 class="filter-group__title">{{ group().title }}</h3>
</div>
<div class="filter-group__option-label-option-count-el">
  @for (option of group().options; track $index) {
    @let checked = option.id === allOptionId()
          ? selectedValues().length === 0
          : selectedValues().includes(option.id);
    @let label = option.count === null ? option.label : `${option.label} (${option.count})`;
    <label class="filter-group__label">
      <input
        type="checkbox"
        [checked]="checked"
        (change)="onToggle.emit([group().id, option.id])"
        class="size-5 accent-[#0D47A1]"
      />
      <span class="filter-group__label-2">{{ label }}</span>
    </label>
  }
</div>
