<div class="empty-results-content__stack">
  <h2 class="empty-results-content__text-black-87 text-black/87">{{ emptyState().title }}</h2>
  <p class="empty-results-content__description">{{ emptyState().description }}</p>
  <div class="empty-results-content__row">
    <button
      type="button"
      (click)="onRetry.emit($event)"
      class="rounded-full border border-[#FDD835] px-[33px] py-[13px] text-[14px] font-semibold leading-5 tracking-[0.28px] transition-colors hover:bg-[rgba(25,118,210,0.08)]"
    >{{ emptyState().retryLabel }}</button>
    <a
      [appCustomerLink]="emptyState().homeHref"
      class="empty-results-content__home-label"
    >{{ emptyState().homeLabel }}</a>
  </div>
</div>
