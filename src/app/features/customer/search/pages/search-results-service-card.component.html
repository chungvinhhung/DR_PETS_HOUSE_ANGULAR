<div class="search-results-service-card__box">
  <img [attr.src]="service().image" [attr.alt]="service().title" class="search-results-service-card__title" />
</div>
<div class="search-results-service-card__stack">
  <div>
    <h3 class="search-results-service-card__text-black-87 text-black/87">{{ service().title }}</h3>
    @if (steps()) {
      <ol class="search-results-service-card__list">
        @for (step of steps(); track step) {
          <li>{{ step }}</li>
        }
      </ol>
    } @else {
      <p class="search-results-service-card__description">{{ service().description }}</p>
    }
  </div>
  <div class="search-results-service-card__row">
    <p class="search-results-service-card__price">{{ formatServicePrice(service().priceValue ?? parseServicePrice(service().price)) }}</p>
    <a appCustomerLink="/dat-lich" class="search-results-service-card__btn-yellow btn-yellow">Đặt lịch ngay</a>
  </div>
</div>
