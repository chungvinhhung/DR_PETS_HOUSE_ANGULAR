<div class="search-sidebar__row">
  <app-customer-icon name="filter" className="mt-0.5 size-[33px] fill-black text-black" />
  <h2 class="search-sidebar__bo-loc-tim-title">Bộ lọc tìm kiếm</h2>
</div>
<div class="search-sidebar__box">
  <p class="search-sidebar__loai-nhu-cau-text">Loại nhu cầu</p>
  <div app-demand-tabs [activeType]="activeType()" (onChange)="onTypeChange.emit($event)"></div>
</div>
<div class="search-sidebar__stack">
  @for (group of groups(); track group.id) {
    <section
      app-filter-group
      [group]="group"
      [selectedValues]="selectedFilters()[group.id] || []"
      (onToggle)="onFilterToggle.emit($event)"
    ></section>
  }
  <div class="search-sidebar__row-2">
    <button
      type="button"
      (click)="onClear.emit($event)"
      class="h-[42px] rounded-[4px] bg-[#FFF176] px-[22px] text-[15px] font-medium uppercase tracking-[0.46px] text-black shadow-elevation transition-colors hover:bg-[#FDD835]"
    >Xóa bộ lọc</button>
  </div>
</div>
