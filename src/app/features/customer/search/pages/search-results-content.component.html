@if (activeType() === 'service') {
  <section app-services-section [results]="results()"></section>
} @else if (activeType() === 'shopping') {
  <section app-products-section [results]="results()"></section>
} @else if (activeType() === 'article') {
  <section app-articles-section [results]="results()"></section>
} @else {
  <div class="flex w-full flex-col gap-8">
    <section app-services-section [results]="results()" [allMode]="true"></section>
    <section app-products-section [results]="results()" [allMode]="true"></section>
    <section app-articles-section [results]="results()" [allMode]="true"></section>
  </div>
}
