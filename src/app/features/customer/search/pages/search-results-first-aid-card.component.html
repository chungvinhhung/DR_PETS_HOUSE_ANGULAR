@if (featured() && post().image) {
  <img [attr.src]="post().image" alt="" class="mb-2 h-40 w-full rounded-[12px] object-cover" />
} @else {
  <div class="h-12"></div>
}
<div class="mt-auto flex flex-col gap-4">
  <p class="text-[14px] font-semibold uppercase leading-5 tracking-[0.28px] text-[#0D47A1]">{{ post().categoryLabel }}</p>
  <h3 class="text-[24px] font-semibold leading-8 text-black/87">{{ post().title }}</h3>
  <p class="text-[16px] leading-6 text-black/87">{{ post().description }}</p>
  <a
    [appCustomerLink]="`/blog/so-cuu/${post().id}`"
    class="font-['Roboto'] text-[16px] font-bold leading-6 text-[#0D47A1]"
  >Đọc ngay →</a>
</div>
