@if (featured() && post().image) {
  <img [attr.src]="post().image" alt="" class="search-results-first-aid-card__image" />
} @else {
  <div class="search-results-first-aid-card__box"></div>
}
<div class="search-results-first-aid-card__stack">
  <p class="search-results-first-aid-card__category-label">{{ post().categoryLabel }}</p>
  <h3 class="search-results-first-aid-card__text-black-87 text-black/87">{{ post().title }}</h3>
  <p class="search-results-first-aid-card__text-black-87-2 text-black/87">{{ post().description }}</p>
  <a
    [appCustomerLink]="`/blog/so-cuu/${post().id}`"
    class="search-results-first-aid-card__id-link"
  >Đọc ngay →</a>
</div>
