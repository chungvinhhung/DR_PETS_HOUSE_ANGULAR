<div app-search-results-section-heading>
  @if (allMode()) {
    Dịch vụ liên quan
  } @else {
    Dịch vụ liên quan
  }
</div>
<div class="services-section__stack">
  @for (service of results().services; track service.id) {
    <article app-search-results-service-card [service]="service"></article>
  }
</div>
@if (!allMode()) {
  <div app-search-results-section-heading>Dịch vụ khác</div>
  <div class="services-section__stack-2">
    @for (service of results().otherServices; track $index) {
      <article app-search-results-service-card [service]="service"></article>
    }
  </div>
  <div class="services-section__row">
    <a
      appCustomerLink="/services/grooming-spa"
      class="services-section__btn-yellow-main btn-yellow-main"
    >Xem tất cả dịch vụ</a>
  </div>
}
