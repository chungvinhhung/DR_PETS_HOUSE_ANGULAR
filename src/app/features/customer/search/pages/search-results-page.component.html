<app-nav-bar />
<main
  class="search-results-page__main"
  [appStyle]="{ minHeight: pageMinHeight() }"
>
  <div class="search-results-page__stack">
    <aside
      app-search-sidebar
      [activeType]="activeType()"
      [facets]="searchResponse().facets"
      [selectedFilters]="selectedFilters()"
      (onFilterToggle)="handleFilterToggle($any($event)[0], $any($event)[1])"
      (onClear)="selectedFilters.set({})"
      (onTypeChange)="handleTypeChange($any($event))"
    ></aside>
    <section class="search-results-page__section">
      <header
        app-results-header
        [query]="isLoading() ? query() : (searchResponse().query || query())"
        [activeType]="activeType()"
        [activeSort]="activeSort()"
        [counts]="filteredSearchResponse().counts"
        [total]="filteredSearchResponse().total"
        [emptyState]="filteredSearchResponse().emptyState"
        (onSortChange)="handleSortChange($any($event))"
        [isEmpty]="!hasResults()"
      ></header>
      @if (isLoading()) {
        <div class="search-results-page__dang-tai-ket-el">Đang tải kết quả tìm kiếm...</div>
      } @else if (loadError()) {
        <div class="search-results-page__load-error">{{ loadError() }}</div>
      } @else if (hasResults()) {
        <app-search-results-content
          [activeType]="activeType()"
          [results]="filteredSearchResponse().results"
          [crossSellServices]="searchResponse().crossSellServices || []"
        />
      } @else {
        <section
          app-empty-results-content
          [emptyState]="filteredSearchResponse().emptyState"
          (onRetry)="handleRetrySearch()"
        ></section>
      }
    </section>
  </div>
</main>
<app-footer [variant]="'white'" />
