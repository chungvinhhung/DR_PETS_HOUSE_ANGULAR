<img
  [attr.src]="productImages.reviewAvatar"
  alt=""
  class="size-[52px] shrink-0 rounded-full object-cover"
  aria-hidden="true"
/>
<div class="write-review-form__stack">
  <div class="write-review-form__row">
    <div class="write-review-form__stack-2">
      <label for="reviewer-name" class="write-review-form__ten-cua-ban-label">Tên của bạn:</label>
      <input
        id="reviewer-name"
        type="text"
        [value]="name() ?? ''"
        (input)="name.set($any($event).target.value)"
        class="h-14 w-full rounded-[16px] border border-solid border-[rgba(0,0,0,0.15)] bg-white px-5 font-['Roboto'] text-[16px] leading-[1.705] text-[#3d3d3d] outline-none backdrop-blur-[11px] focus:border-[#0d47a1]"
      />
    </div>
    <div class="write-review-form__stack-3">
      @if (targetName()) {
        <div class="write-review-form__row-2">
          <span class="write-review-form__target-label">{{ targetLabel() }}:</span>
          <span class="write-review-form__target-name">{{ targetName() }}</span>
        </div>
      }
      <div class="write-review-form__row-3">
        <span class="write-review-form__ten-cua-ban-label">Đánh giá của bạn:</span>
        <div app-star-rating [value]="rating()" (onChange)="rating.set($event)"></div>
      </div>
    </div>
  </div>
  <div class="write-review-form__box">
    <textarea
      id="review-text"
      [value]="review() ?? ''"
      (input)="review.set($any($event).target.value)"
      placeholder="Viết đánh giá của bạn..."
      rows="4"
      class="write-review-form__review-text"
    ></textarea>
  </div>
  <div class="write-review-form__row-4">
    <button
      type="submit"
      class="btn-brand-yellow flex h-[42px] items-center justify-center gap-2 rounded-[4px] px-[22px] py-2 shadow-elevation"
    >
      <span class="write-review-form__gui-danh-gia-text">Gửi đánh giá</span>
    </button>
  </div>
</div>
