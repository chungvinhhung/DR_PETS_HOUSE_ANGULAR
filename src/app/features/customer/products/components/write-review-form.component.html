<img
  [attr.src]="productImages.reviewAvatar"
  alt=""
  class="size-[52px] shrink-0 rounded-full object-cover"
  aria-hidden="true"
/>
<div class="flex min-w-0 flex-1 flex-col gap-[30px]">
  <div class="flex flex-wrap items-start gap-8">
    <div class="flex w-full max-w-[400px] flex-col gap-[10px]">
      <label for="reviewer-name" class="font-['Roboto'] text-[16px] leading-[1.705] text-[#3d3d3d]">Tên của bạn:</label>
      <input
        id="reviewer-name"
        type="text"
        [value]="name() ?? ''"
        (input)="name.set($any($event).target.value)"
        class="h-14 w-full rounded-[16px] border border-solid border-[rgba(0,0,0,0.15)] bg-white px-5 font-['Roboto'] text-[16px] leading-[1.705] text-[#3d3d3d] outline-none backdrop-blur-[11px] focus:border-[#0d47a1]"
      />
    </div>
    <div class="flex min-w-[280px] flex-col pt-6 gap-[20px]">
      @if (targetName()) {
        <div class="flex gap-[10px] overflow-hidden font-['Roboto'] text-[16px] leading-[1.705]">
          <span class="shrink-0 text-[#3d3d3d]">{{ targetLabel() }}:</span>
          <span class="min-w-0 flex-1 text-[rgba(0,0,0,0.6)]">{{ targetName() }}</span>
        </div>
      }
      <div class="flex items-center gap-[10px]">
        <span class="font-['Roboto'] text-[16px] leading-[1.705] text-[#3d3d3d]">Đánh giá của bạn:</span>
        <div app-star-rating [value]="rating()" (onChange)="rating.set($event)"></div>
      </div>
    </div>
  </div>
  <div class="w-full">
    <textarea
      id="review-text"
      [value]="review() ?? ''"
      (input)="review.set($any($event).target.value)"
      placeholder="Viết đánh giá của bạn..."
      rows="4"
      class="h-[136px] w-full resize-none rounded-[16px] border border-solid border-[rgba(0,0,0,0.15)] bg-white px-5 pb-2 pt-[18px] font-['Roboto'] text-[16px] leading-[1.705] text-[#3d3d3d] placeholder:text-[#949494] outline-none backdrop-blur-[11px] focus:border-[#0d47a1]"
    ></textarea>
  </div>
  <div class="flex justify-center">
    <button
      type="submit"
      class="btn-brand-yellow flex h-[42px] items-center justify-center gap-2 rounded-[4px] px-[22px] py-2 shadow-elevation"
    >
      <span class="font-['Roboto'] text-[15px] font-bold uppercase leading-[26px] tracking-[0.46px] text-black">Gửi đánh giá</span>
    </button>
  </div>
</div>
