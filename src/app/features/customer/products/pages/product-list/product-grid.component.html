@if (!products().length) {
  <div class="product-grid__khong-tim-thay-el">Không tìm thấy sản phẩm phù hợp.</div>
} @else {
  <div class="product-grid__grid">
    @for (product of products(); track product.id) {
      <app-shopping-product-card [product]="product" [href]="'/product-details'" />
    }
  </div>
}
