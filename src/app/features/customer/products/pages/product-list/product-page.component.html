<app-nav-bar />
<div class="product-page__box">
  <nav
    app-breadcrumb
    [items]="[
          { label: 'Mua sắm', to: '/petshop' },
          { label: 'Danh mục sản phẩm' }
        ]"
  ></nav>
  <main class="product-page__main">
    <div class="product-page__stack">
      <aside
        app-filter-sidebar
        [categoryOptions]="categoryOptions()"
        [selectedCategories]="selectedCategories()"
        [selectedPrices]="selectedPrices()"
        (onCategoryChange)="toggleCategory($any($event))"
        (onPriceChange)="togglePrice($any($event))"
        (onClear)="clearFilters()"
      ></aside>
      <section class="product-page__section">
        <h1 class="product-page__danh-muc-san-title">Danh mục sản phẩm của chúng tôi</h1>
        <div class="product-page__box-2">
          <form
            app-product-search-and-sort
            [search]="search()"
            (onSearchChange)="search.set($event)"
            (onSearch)="resetDisplayCount(setSearchQueryFn, search().trim())"
            (onClearSearch)="clearSearch()"
            [sortOrder]="sortOrder()"
            (onSortChange)="resetDisplayCount(setSortOrderFn, $any($event))"
          ></form>
        </div>
        @if (searchQuery()) {
          <p class="product-page__search-query">Kết quả tìm kiếm cho "{{ searchQuery() }}"</p>
        }
        <div class="product-page__box-2">
          @if (isLoadingProducts()) {
            <div class="product-page__dang-tai-san-el">Đang tải sản phẩm...</div>
          } @else if (loadError()) {
            <div class="product-page__load-error">{{ loadError() }}</div>
          } @else {
            <app-product-grid [products]="products()" />
          }
        </div>
        @if (!isLoadingProducts() && !loadError()) {
          <div
            app-load-more
            [shown]="products().length"
            [total]="totalProducts()"
            [hasMore]="currentPage() < totalPages()"
            [isLoading]="isLoading()"
            (onLoadMore)="loadMore()"
          ></div>
        }
      </section>
    </div>
  </main>
  <app-footer [variant]="'white'" />
</div>
