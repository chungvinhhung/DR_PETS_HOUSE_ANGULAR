<p class="load-more__from-label">Hiển thị {{ fromLabel() }}–{{ shown() }} trong {{ total() }} sản phẩm</p>
<div class="load-more__box"><span class="load-more__text" [appStyle]="styles1()"></span></div>
@if (hasMore()) {
  <button
    type="button"
    (click)="onLoadMore.emit($event)"
    [disabled]="isLoading()"
    class="flex h-[42px] items-center gap-1 rounded-[4px] bg-[#FDD835] px-[22px] text-[15px] font-medium uppercase tracking-[0.46px] text-black shadow-elevation transition-colors hover:bg-[#FDD835] disabled:opacity-60"
  >
    @if (isLoading()) {
      Đang tải...
    } @else {
      Xem thêm
    }
  </button>
}
