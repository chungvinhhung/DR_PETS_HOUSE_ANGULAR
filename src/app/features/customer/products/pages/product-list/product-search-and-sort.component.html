<label class="flex h-[56px] min-w-0 flex-1 items-center justify-between rounded-[42px] border border-[rgba(25,118,210,0.5)] bg-white/80 py-2 pl-5 pr-2 backdrop-blur-[11px]">
  <input
    #inputRef
    [value]="search() ?? ''"
    (input)="onSearchChange.emit($any($event).target.value)"
    (focusin)="selectSearchText()"
    placeholder="Bạn đang tìm kiếm gì?"
    class="min-w-0 flex-1 bg-transparent text-[16px] text-[#5F5F5F] outline-none placeholder:text-[#5F5F5F]"
  />
  @if (search()) {
    <button
      type="button"
      (click)="handle2()"
      class="mr-3 flex h-10 w-10 items-center justify-center rounded-full bg-[#E3F2FD] text-[28px] font-semibold leading-none text-[#0D47A1] transition-colors hover:bg-[#BBDEFB]"
      aria-label="Xóa tìm kiếm"
    >×</button>
  }
  <button
    type="submit"
    class="flex h-10 w-10 items-center justify-center rounded-full transition-colors hover:bg-[#FFF176]"
    aria-label="Tìm kiếm sản phẩm"
  >
    <img [attr.src]="productImages.searchIcon" alt="" class="h-7 w-7" />
  </button>
</label>
<label class="flex h-[56px] w-[150px] shrink-0 sm:w-[187px] cursor-pointer items-center gap-[14px] rounded-[42px] border border-[rgba(25,118,210,0.5)] bg-white px-[17px]">
  <svg class="h-4 w-[18px] shrink-0 text-[#414141]" viewBox="0 0 18 12" aria-hidden="true">
    <path d="M1 1h16M1 6h10M1 11h5" stroke="currentColor" stroke-width="1.5" />
  </svg>
  <select
    [selectValue]="sortOrder()"
    (change)="onSortChange.emit($any($event).target.value)"
    class="w-full cursor-pointer appearance-none bg-transparent text-center text-[16px] font-medium tracking-[0.5px] text-[rgba(0,0,0,0.87)] outline-none"
    aria-label="Sắp xếp giá"
  >
    <option value="" disabled hidden>Sắp xếp giá</option>
    <option value="asc">Giá tăng dần</option>
    <option value="desc">Giá giảm dần</option>
  </select>
</label>
