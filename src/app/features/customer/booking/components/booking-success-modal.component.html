<div
  class="flex min-h-[310px] w-full max-w-[320px] flex-col items-center justify-center gap-6 rounded-[10px] border border-slate-300 bg-white bg-cover bg-center p-6 text-center shadow-2xl md:max-w-[688px] md:gap-8 md:p-10 lg:max-w-4xl"
  [appStyle]="{ backgroundImage: `url(${successPanelBackground})` }"
>
  <img [attr.src]="successCheckGroup" alt="" class="h-[69px] w-[69px]" />
  <div>
    <h2 class="text-3xl font-bold text-[#3d3d3d] md:text-5xl">Đặt lịch thành công</h2>
    <p class="mx-auto mt-3 max-w-lg text-base text-[#949494]">Lịch hẹn của bạn đã được xác nhận. Xem chi tiết và theo dõi lịch hẹn tại ‘Lịch sử đặt lịch’.</p>
  </div>
  <div class="flex flex-col justify-center gap-3 md:flex-row md:flex-wrap md:gap-5">
    <a
      appCustomerLink="/"
      class="rounded bg-secondary px-6 py-3 text-sm font-bold uppercase tracking-[0.46px] shadow-elevation"
    >Trở về trang chủ</a>
    <a
      appCustomerLink="/appointment/history"
      class="rounded border border-secondary px-6 py-3 text-sm font-medium uppercase tracking-[0.46px]"
    >Chi tiết lịch hẹn</a>
  </div>
</div>
