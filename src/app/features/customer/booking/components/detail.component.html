<p class="text-xs font-bold tracking-wider text-slate-500">{{ label() }}</p>
<p class="mt-2 flex items-center gap-3 text-sm font-bold text-slate-900 md:text-base">
  <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white shadow">
    <img [attr.src]="icon()" alt="" class="h-5 w-5" />
  </span>
  <span>{{ value() }}</span>
</p>
@if (subValue()) {
  <p class="ml-12 mt-1 text-xs font-medium text-slate-500">{{ subValue() }}</p>
}
