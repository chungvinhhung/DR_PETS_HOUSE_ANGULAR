<label class="search-and-sort__label">
  <input
    [value]="searchInput() ?? ''"
    (input)="onSearchInputChange.emit($any($event).target.value)"
    placeholder="Tìm kiếm theo Mã lịch hẹn, Thời gian, tên thú cưng hoặc dịch vụ"
    class="search-and-sort__tim-kiem-theo-ma"
  />
  @if (searchInput()) {
    <button
      type="button"
      (click)="onClearSearch.emit($event)"
      class="mr-3 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#E3F2FD] text-[28px] font-semibold leading-none text-[#0D47A1] transition-colors hover:bg-[#BBDEFB]"
      aria-label="Xóa tìm kiếm lịch hẹn"
    >×</button>
  }
  <button
    type="submit"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full transition-colors hover:bg-[#fff176]"
    aria-label="Tìm kiếm lịch hẹn"
  >
    <img [attr.src]="appointmentImages.searchIcon" alt="" class="search-and-sort__search-icon" />
  </button>
</label>
<label class="search-and-sort__label-2">
  <svg class="h-4 w-[18px] shrink-0 text-[#414141]" viewBox="0 0 18 12" aria-hidden="true">
    <path d="M1 1h16M1 6h10M1 11h5" stroke="currentColor" stroke-width="1.5" />
  </svg>
  <select
    [selectValue]="sortOrder()"
    (change)="onSortChange.emit($any($event).target.value)"
    class="search-and-sort__sap-xep-lich-hen"
    aria-label="Sắp xếp lịch hẹn"
  >
    <option value="newest">Mới nhất</option>
    <option value="oldest">Cũ nhất</option>
  </select>
</label>
