<app-nav-bar />
<main class="booking-page__main">
  <div app-stepper [step]="step()"></div>
  <div class="booking-page__box">
    @if (step() === 1) {
      <app-service-selection
        [selectedServiceType]="selectedServiceType()"
        [setSelectedServiceType]="setSelectedServiceTypeFn"
        [selectedServices]="selectedServices()"
        [setSelectedServices]="setSelectedServicesFn"
        [selectedPets]="selectedPets()"
        [petInfos]="petInfos()"
        [selectedDate]="selectedDate()"
        [setSelectedDate]="setSelectedDateFn"
        [selectedSlot]="selectedSlot()"
        [setSelectedSlot]="setSelectedSlotFn"
        [ownerInfo]="ownerInfo()"
        [setOwnerInfo]="setOwnerInfoFn"
        [branches]="branches()"
        [services]="services()"
        [timeSlots]="timeSlots()"
        [slotsLoading]="slotsLoading()"
        (onNext)="handle1()"
      />
    }
    @if (step() === 2) {
      <app-info-form
        [selectedPets]="selectedPets()"
        [setSelectedPets]="setSelectedPetsFn"
        [petInfos]="petInfos()"
        [setPetInfos]="setPetInfosFn"
        [ownerInfo]="ownerInfo()"
        [setOwnerInfo]="setOwnerInfoFn"
        [pets]="pets()"
        [petsLoading]="petsLoading()"
        [petsError]="petsError()"
        (onBack)="handleInfoBack()"
        (onNext)="step.set(3)"
      />
    }
    @if (step() === 3) {
      <app-booking-payment-step
        [selectedDate]="selectedDate()"
        [selectedSlot]="selectedSlot()"
        [selectedPet]="selectedPets()[0] || null"
        [selectedPets]="selectedPets()"
        [petInfo]="petInfos()[0]"
        [petInfos]="petInfos()"
        [ownerInfo]="ownerInfo()"
        [selectedServices]="compute2()"
        [paymentMode]="paymentMode()"
        [setPaymentMode]="setPaymentModeFn"
        (onBack)="step.set(2)"
        (onConfirm)="handleConfirm($any($event))"
      />
    }
    @if (bookingError()) {
      <p class="booking-page__booking-error">{{ bookingError() }}</p>
    }
    @if (bookingSubmitting()) {
      <p class="booking-page__dang-gui-yeu-text">Đang gửi yêu cầu đặt lịch...</p>
    }
  </div>
  <app-footer />
</main>
@if (success()) {
  <div app-booking-success-modal [isGuest]="!authService.isAuthenticated()"></div>
}
