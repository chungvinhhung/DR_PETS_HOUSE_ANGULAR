<app-booking-card [className]="'p-5 md:p-8'">
  <div class="mb-5 flex items-center justify-between gap-4">
    <h2 class="text-xl font-black text-blue-900">
      THÔNG TIN THÚ CƯNG@if (showIndex()) {
        {{ ` ${index() + 1}` }}
      }
    </h2>
    @if (canRemove()) {
      <button type="button" (click)="onRemove.emit(petInfo().id)" class="text-sm font-bold text-[#d32f2f]">Xóa</button>
    }
  </div>

  <div class="grid gap-5 md:grid-cols-6">
    <label
      app-booking-field
      [className]="'md:col-span-4'"
      [label]="'Tên thú cưng'"
      [required]="true"
      [showError]="validationAttempted()"
      [value]="petInfo().name"
      (onChange)="onChange.emit([petInfo().id, 'name', $any($event).target.value])"
    ></label>

    @if (selectSpeciesValue() === 'Khác') {
      <!-- Khi chọn Khác: dùng chính thẻ <label> giữ nguyên chiều cao, bo góc và viền của app-booking-field -->
      <label
        class="block md:col-span-2"
        [attr.title]="validationAttempted() && !petInfo()?.species?.trim() ? 'Vui lòng điền thông tin' : undefined"
        [attr.data-booking-error]="validationAttempted() && !petInfo()?.species?.trim() ? 'true' : undefined"
        [attr.tabindex]="validationAttempted() && !petInfo()?.species?.trim() ? -1 : undefined"
      >
        <span class="mb-2 block text-sm font-medium text-slate-900">
          Loài <span class="text-red-500">*</span>
        </span>
        <span
          [class]="`flex h-[46px] w-full items-center overflow-hidden rounded-full border bg-white text-sm text-slate-800 transition focus-within:border-blue-900 focus-within:ring-2 focus-within:ring-blue-900/20 ${
            validationAttempted() && !petInfo()?.species?.trim() ? 'border-red-500 ring-2 ring-red-500/20' : 'border-slate-300'
          }`"
        >
          <select
            [value]="selectSpeciesValue()"
            (change)="handleSpeciesSelect($any($event).target.value)"
            class="h-full w-[96px] shrink-0 border-0 bg-transparent pl-4 pr-1 text-sm text-slate-800 outline-none"
          >
            @for (item of speciesOptions; track item) {
              <option [value]="item" [selected]="item === selectSpeciesValue()">
                {{ item }}
              </option>
            }
          </select>

          <span class="h-6 w-px shrink-0 bg-slate-300"></span>

          <input
            type="text"
            [value]="customSpeciesValue()"
            (input)="handleCustomSpeciesInput($any($event).target.value)"
            placeholder="VD: chim, rắn,..."
            class="h-full min-w-0 flex-1 border-0 bg-transparent px-3 text-sm text-slate-800 outline-none focus:ring-0"
          />
        </span>
      </label>
    } @else {
      <!-- Khi chọn Chó / Mèo: giữ nguyên 100% component app-booking-field gốc -->
      <label
        app-booking-field
        [className]="'md:col-span-2'"
        [label]="'Loài'"
        [as]="'select'"
        [options]="speciesOptions"
        [required]="true"
        [showError]="validationAttempted()"
        [value]="selectSpeciesValue()"
        (onChange)="handleSpeciesSelect($any($event).target.value)"
      ></label>
    }

    <!-- 3 ô Giống, Tuổi, Cân nặng nằm NGOÀI khối @if/@else để luôn hiển thị -->
    <label
      app-booking-field
      [className]="'md:col-span-2'"
      [label]="'Giống'"
      [value]="petInfo().breed"
      (onChange)="onChange.emit([petInfo().id, 'breed', $any($event).target.value])"
    ></label>

    <label
      app-booking-field
      [className]="'md:col-span-2'"
      [label]="'Tuổi'"
      [suffix]="'tuổi'"
      [value]="petInfo().age"
      (onChange)="onChange.emit([petInfo().id, 'age', $any($event).target.value])"
    ></label>

    <label
      app-booking-field
      [className]="'md:col-span-2'"
      [label]="'Cân nặng'"
      [suffix]="'kg'"
      [required]="true"
      [showError]="validationAttempted()"
      [value]="petInfo().weight"
      (onChange)="onChange.emit([petInfo().id, 'weight', $any($event).target.value])"
    ></label>

    <div class="md:col-span-3">
      <p class="mb-3 text-sm font-medium text-slate-900">Giới tính</p>
      <div class="flex flex-wrap gap-5 text-sm">
        <label>
          <input
            type="radio"
            [attr.name]="`gender-${petInfo().id}`"
            [checked]="petInfo().gender === 'male'"
            (change)="onChange.emit([petInfo().id, 'gender', 'male'])"
            class="mr-2 accent-blue-900"
          />Đực</label>
        <label>
          <input
            type="radio"
            [attr.name]="`gender-${petInfo().id}`"
            [checked]="petInfo().gender === 'female'"
            (change)="onChange.emit([petInfo().id, 'gender', 'female'])"
            class="mr-2 accent-blue-900"
          />Cái</label>
      </div>
    </div>

    <div class="md:col-span-3">
      <p class="mb-3 text-sm font-medium text-slate-900">Tình trạng sức khỏe <span class="text-red-500">*</span></p>
      <div
        [class]="`flex flex-wrap gap-4 rounded-lg text-sm ${validationAttempted() && !petInfo().status ? 'ring-2 ring-red-500' : ''}`"
        [attr.title]="validationAttempted() && !petInfo().status ? 'Vui lòng điền thông tin' : undefined"
        [attr.data-booking-error]="validationAttempted() && !petInfo().status ? 'true' : undefined"
        [attr.tabindex]="validationAttempted() && !petInfo().status ? -1 : undefined"
      >
        <label>
          <input
            type="radio"
            [attr.name]="`status-${petInfo().id}`"
            [checked]="petInfo().status === 'normal'"
            (change)="onChange.emit([petInfo().id, 'status', 'normal'])"
            class="mr-2 h-4 w-4 cursor-pointer accent-blue-900 text-blue-900 border-gray-300 focus:ring-blue-900"
          />Bình thường</label>
        <label>
          <input
            type="radio"
            [attr.name]="`status-${petInfo().id}`"
            [checked]="petInfo().status === 'treating'"
            (change)="onChange.emit([petInfo().id, 'status', 'treating'])"
            class="mr-2 h-4 w-4 cursor-pointer accent-blue-900 text-blue-900 border-gray-300 focus:ring-blue-900"
          />Đang điều trị</label>
        <label>
          <input
            type="radio"
            [attr.name]="`status-${petInfo().id}`"
            [checked]="petInfo().status === 'chronic'"
            (change)="onChange.emit([petInfo().id, 'status', 'chronic'])"
            class="mr-2 h-4 w-4 cursor-pointer accent-blue-900 text-blue-900 border-gray-300 focus:ring-blue-900"
          />Có bệnh nền</label>
      </div>
    </div>

    <label class="md:col-span-6">
      <span class="mb-2 block text-sm font-medium text-slate-900">Thông tin thêm</span>
      <textarea
        placeholder="Nhập ghi chú, yêu cầu đặc biệt hoặc thông tin bổ sung tại đây..."
        [value]="petInfo().notes ?? ''"
        (input)="onChange.emit([petInfo().id, 'notes', $any($event).target.value])"
        class="h-15 w-full text-sm resize-none rounded-2xl border border-slate-300 px-4 py-3 outline-none focus:border-blue-900"
      ></textarea>
    </label>
  </div>
</app-booking-card>
