<div class="booking-layout">
  <div class="booking-main">
    <!-- Lựa chọn loại thú cưng -->
    <div class="pet-type-grid">
      <button
        app-pet-summary-card
        [selectedPets]="selectedPets()"
        [active]="profileMode()"
        (onClick)="showPetPicker.set(true)"
      ></button>

      <button
        type="button"
        class="other-pet-btn"
        [class.is-active]="!profileMode()"
        (click)="chooseOtherPet()"
      >
        @if (!profileMode()) {
          <img [attr.src]="serviceSelectedCheck" alt="" class="check-icon" />
        }
        <strong class="other-pet-title">Thú cưng khác</strong>
        <span class="other-pet-desc">Bạn chưa tạo Hồ sơ thú cưng cho bé này</span>
      </button>
    </div>

    <!-- Danh sách khung thông tin thú cưng -->
    <div class="pet-cards-list">
      @for (petInfo of activePetInfos(); track petInfo.id; let index = $index) {
        <app-pet-info-card
          [petInfo]="petInfo"
          [index]="index"
          [showIndex]="activePetInfos().length > 1"
          [canRemove]="!profileMode() && activePetInfos().length > 1"
          [validationAttempted]="validationAttempted()"
          (onChange)="updatePetInfo($any($event)[0], $any($event)[1], $any($event)[2])"
          (onRemove)="removeOtherPetInfo($any($event))"
        />
      }

      @if (!profileMode()) {
        <button
          type="button"
          class="add-pet-btn"
          (click)="addOtherPetInfo()"
        >
          + Thêm một bé nữa
        </button>
      }
    </div>
  </div>

  <!-- Cột thông tin chủ thú cưng -->
  <app-booking-card [className]="'owner-card'">
    <h2 class="owner-title">THÔNG TIN CHỦ THÚ CƯNG</h2>
    <div class="owner-fields">
      <label
        app-booking-field
        [label]="'Họ và tên'"
        [required]="true"
        [showError]="validationAttempted()"
        [value]="ownerInfo().name"
        (onChange)="updateOwnerInfo('name', $any($event).target.value)"
      ></label>

      <label
        app-booking-field
        [label]="'Số điện thoại'"
        [required]="true"
        [showError]="validationAttempted()"
        [value]="ownerInfo().phone"
        (onChange)="updateOwnerInfo('phone', $any($event).target.value)"
      ></label>

      <label
        app-booking-field
        [label]="'Email'"
        [value]="ownerInfo().email"
        (onChange)="updateOwnerInfo('email', $any($event).target.value)"
      ></label>

      <label
        class="agreement-label"
        [class.has-error]="validationAttempted() && !ownerInfo().agreed"
        [attr.title]="validationAttempted() && !ownerInfo().agreed ? 'Vui lòng điền thông tin' : undefined"
        [attr.data-booking-error]="validationAttempted() && !ownerInfo().agreed ? 'true' : undefined"
        [attr.tabindex]="validationAttempted() && !ownerInfo().agreed ? -1 : undefined"
      >
        <input
          type="checkbox"
          class="agreement-checkbox"
          [checked]="ownerInfo().agreed"
          (change)="updateOwnerInfo('agreed', $any($event).target.checked)"
        />
         <span>
          Tôi đồng ý với
          <a
            href="/policies/dat-lich-doi-huy-lich"
            target="_blank"
            rel="noopener noreferrer"
            class="policy-link"
          > Chính sách đặt lịch, đổi lịch & hủy lịch</a>
          tại Dr.Pet’s House
        </span>
      </label>
    </div>
  </app-booking-card>
</div>

<div app-flow-buttons (onBack)="onBack.emit($event)" (onNext)="handleNext()"></div>

@if (showPetPicker()) {
  <div
    app-pet-selection-modal
    [pets]="pets()"
    [loading]="petsLoading()"
    [error]="petsError()"
    [selectedPets]="selectedPets()"
    (onClose)="showPetPicker.set(false)"
    (onConfirm)="handle1($any($event))"
  ></div>
}
