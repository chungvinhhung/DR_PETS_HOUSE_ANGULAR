<button
  type="button"
  (click)="onBack.emit($event)"
  class="rounded bg-secondary-light px-5 py-2 text-sm font-bold uppercase tracking-[0.46px] shadow-elevation md:px-6 md:py-3"
>‹ Quay lại</button>
<button
  type="button"
  (click)="onNext.emit($event)"
  class="rounded bg-secondary px-5 py-2 text-sm font-bold uppercase tracking-[0.46px] shadow-elevation md:px-6 md:py-3"
>Tiếp tục ›</button>
