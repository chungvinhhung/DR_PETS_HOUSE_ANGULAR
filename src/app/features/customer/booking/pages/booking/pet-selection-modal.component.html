<div class="pet-selection-modal__box">
  <div class="pet-selection-modal__row">
    <div>
      <h2 class="pet-selection-modal__chon-ho-so-title">
        Chọn hồ sơ thú cưng
      </h2>
      <p class="pet-selection-modal__chon-thu-cung-text">
        Chọn thú cưng muốn đặt lịch nhé
      </p>
    </div>

    <button
      type="button"
      (click)="handleClose()"
      aria-label="Đóng"
      class="flex h-8 w-8 items-center justify-center rounded-full text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800"
    >
      <svg class="pet-selection-modal__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="pet-selection-modal__box-2 space-y-3.5">
    @if (loading()) {
      <div class="pet-selection-modal__dang-tai-ho-el">
        Đang tải hồ sơ thú cưng...
      </div>
    }

    @if (!loading() && error()) {
      <div class="pet-selection-modal__error">
        {{ error() }}
      </div>
    }

    @if (!loading()) {
      @for (pet of displayPets(); track pet.id) {
        <div
          (click)="togglePet(pet)"
          [class]="classes1(pet)"
          class="pet-selection-modal__box-3"
        >
          <img
            [src]="pet.avatar || pet.image || petImages[pet.name] || buddyImg"
            [alt]="pet.name"
            class="pet-selection-modal__name"
          />

          <div class="pet-selection-modal__box-4">
            <div class="pet-selection-modal__name-2">{{ pet.name }}</div>
            <div class="pet-selection-modal__breed">{{ pet.breed }} • {{ pet.age }}</div>
          </div>

          <button type="button" [class]="classes2(pet)" class="shrink-0 transition-colors">
            @if (cond3(pet)) {
              <span class="pet-selection-modal__text">
                <svg class="pet-selection-modal__icon-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Đã chọn</span>
              </span>
            } @else {
              <span>Chọn</span>
            }
          </button>
        </div>
      }
    }

    <button
      type="button"
      (click)="openCreatePetForm()"
      class="flex w-full items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 text-left transition-all hover:border-[#2b5496]/50 hover:bg-slate-50"
    >
      <div class="pet-selection-modal__row-2">
        <svg class="pet-selection-modal__icon-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <div class="pet-selection-modal__box-4">
        <div class="pet-selection-modal__them-ho-so-el">Thêm hồ sơ thú cưng mới</div>
        <div class="pet-selection-modal__thu-cung-chua-el">Thú cưng chưa có hồ sơ, vui lòng tạo hồ sơ</div>
      </div>
    </button>
  </div>

  <div class="pet-selection-modal__box-5">
    <button
      type="button"
      (click)="onConfirm.emit(draftPets())"
      [disabled]="!draftPets() || draftPets().length === 0"
      class="w-full rounded-full bg-[#F8D64E] py-3.5 text-center text-[15px] font-bold text-slate-900 shadow-sm transition-all hover:bg-[#f5ce32] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
    >
      Tiếp tục
    </button>
  </div>
</div>

@if (isCreatingPet()) {
  <div class="pet-selection-modal__overlay">
    <div class="pet-selection-modal__box-6">
      <div
        app-pet-form-page
        [embedded]="true"
        (onSaved)="handlePetSaved($any($event))"
        (onCancel)="cancelCreatePet()"
      ></div>
    </div>
  </div>
}
