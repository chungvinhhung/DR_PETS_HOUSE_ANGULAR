<div class="relative w-full max-w-[460px] rounded-[24px] bg-white p-6 shadow-2xl sm:p-8">
  <div class="mb-6 flex items-start justify-between">
    <div>
      <h2 class="text-[22px] font-bold leading-tight text-[#1e3a8a]">
        Chọn hồ sơ thú cưng
      </h2>
      <p class="mt-1 text-sm text-slate-600">
        Chọn thú cưng muốn đặt lịch nhé
      </p>
    </div>

    <button
      type="button"
      (click)="handleClose()"
      aria-label="Đóng"
      class="flex h-8 w-8 items-center justify-center rounded-full text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="max-h-[60vh] space-y-3.5 overflow-y-auto pr-1">
    @if (loading()) {
      <div class="py-8 text-center text-sm text-slate-500">
        Đang tải hồ sơ thú cưng...
      </div>
    }

    @if (!loading() && error()) {
      <div class="rounded-xl bg-red-50 p-4 text-center text-sm text-red-600">
        {{ error() }}
      </div>
    }

    @if (!loading()) {
      @for (pet of displayPets(); track pet.id) {
        <div
          (click)="togglePet(pet)"
          [class]="classes1(pet)"
          class="cursor-pointer transition-all"
        >
          <img
            [src]="pet.avatar || pet.image || petImages[pet.name] || buddyImg"
            [alt]="pet.name"
            class="h-14 w-14 shrink-0 rounded-full border border-slate-100 object-cover"
          />

          <div class="min-w-0 flex-1">
            <div class="text-[17px] font-bold text-slate-900">{{ pet.name }}</div>
            <div class="mt-0.5 text-[13.5px] text-slate-500">{{ pet.breed }} • {{ pet.age }}</div>
          </div>

          <button type="button" [class]="classes2(pet)" class="shrink-0 transition-colors">
            @if (cond3(pet)) {
              <span class="flex items-center gap-1.5">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Đã chọn</span>
              </span>
            } @else {
              <span>Chọn</span>
            }
          </button>
        </div>
      }
    }

    <button
      type="button"
      (click)="openCreatePetForm()"
      class="flex w-full items-center gap-4 rounded-2xl border border-slate-200 bg-white p-4 text-left transition-all hover:border-[#2b5496]/50 hover:bg-slate-50"
    >
      <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full border border-slate-100 bg-slate-50 text-slate-400">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-[16px] font-bold text-slate-900">Thêm hồ sơ thú cưng mới</div>
        <div class="mt-0.5 text-[13px] text-slate-500">Thú cưng chưa có hồ sơ, vui lòng tạo hồ sơ</div>
      </div>
    </button>
  </div>

  <div class="mt-7">
    <button
      type="button"
      (click)="onConfirm.emit(draftPets())"
      [disabled]="!draftPets() || draftPets().length === 0"
      class="w-full rounded-full bg-[#F8D64E] py-3.5 text-center text-[15px] font-bold text-slate-900 shadow-sm transition-all hover:bg-[#f5ce32] active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
    >
      Tiếp tục
    </button>
  </div>
</div>

@if (isCreatingPet()) {
  <div class="fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/45 p-4 backdrop-blur-sm">
    <div class="max-h-[95vh] w-full max-w-4xl overflow-y-auto rounded-2xl bg-slate-50 shadow-2xl">
      <div
        app-pet-form-page
        [embedded]="true"
        (onSaved)="handlePetSaved($any($event))"
        (onCancel)="cancelCreatePet()"
      ></div>
    </div>
  </div>
}
