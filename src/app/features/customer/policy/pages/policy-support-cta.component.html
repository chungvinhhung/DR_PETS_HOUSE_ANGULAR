<div class="policy-support-cta__box">
  <h2 class="policy-support-cta__support-title">{{ policy().supportTitle }}</h2>
  <p class="policy-support-cta__support-description">{{ policy().supportDescription }}</p>
</div>
<div class="policy-support-cta__row">
  <a
    href="tel:0868686868"
    class="policy-support-cta__link"
  >
    <img [attr.src]="policyImages.ctaPhone" alt="" class="policy-support-cta__cta-phone" />Gọi ngay</a>
  <a
    appCustomerLink="/contact"
    class="policy-support-cta__link-2"
  >
    <img [attr.src]="policyImages.ctaMessage" alt="" class="policy-support-cta__cta-phone" />
    <span class="policy-support-cta__de-lai-loi-text">Để lại lời nhắn</span>
  </a>
</div>
