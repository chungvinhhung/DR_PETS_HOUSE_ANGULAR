<div app-canvas-layout>
  <app-nav-bar />
  <main class="policy-page__main policy-page">
    <nav
      app-breadcrumb
      [items]="[
            { label: 'Trang chủ', to: '/' },
            { label: 'Hỗ trợ khách hàng' },
            { label: policy().title }
          ]"
      [variant]="'blog'"
      [className]="'w-full max-w-page'"
    ></nav>
    <div class="policy-page__stack">
      <div class="policy-page__stack-2">
        <article app-policy-article [policy]="policy()"></article>
        <aside app-policy-related-sidebar [activeSlug]="navService.params()['slug']"></aside>
      </div>
      <section app-policy-support-cta [policy]="policy()"></section>
    </div>
  </main>
  <app-footer [variant]="'white'" />
</div>
