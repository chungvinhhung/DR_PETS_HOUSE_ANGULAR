<h1 class="policy-article__title">{{ policy().title }}</h1>
<div class="policy-article__row">
  @for (item of policy().meta; track item.id) {
    <span class="policy-article__text">
      <img [attr.src]="item.icon" alt="" [class]="item.iconClassName" />
      <span [class]="item.italic
                ? 'font-[\'Public_Sans\'] italic tracking-normal text-[#434653]'
                : ''">{{ item.label }}</span>
    </span>
  }
</div>
<div class="policy-article__body">
  @for (section of policy().sections; track section.id) {
    <section app-policy-section [section]="section"></section>
  }
</div>
