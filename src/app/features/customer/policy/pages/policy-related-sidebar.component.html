<div class="policy-related-sidebar__heading policy-related__heading">
  <h2 class="policy-related-sidebar__co-lien-quan-title">CÓ LIÊN QUAN</h2>
</div>
<nav class="policy-related-sidebar__chinh-sach-lien-quan" aria-label="Chính sách liên quan">
  @for (item of relatedPolicies(); track item.label) {
    <a
      [appCustomerLink]="item.href"
      [class]="`flex h-[46px] items-center justify-center rounded-[8px] text-center text-[14px] font-semibold leading-5 text-[#1e293b] transition-colors hover:bg-[#FFF9C4] hover:text-[#005AB4] ${
            item.active ? 'bg-[#FFF9C4] text-[#005AB4]' : ''
          }`"
    >{{ item.label }}</a>
  }
</nav>
