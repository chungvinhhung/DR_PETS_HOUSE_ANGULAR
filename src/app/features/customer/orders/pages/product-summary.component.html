<img
  [attr.src]="productImage()"
  [attr.alt]="safeProduct().name"
  (error)="onImageError($event)"
  class="product-summary__name"
/>
<div class="product-summary__stack">
  <strong [class]="`${large() ? 'text-[20px]' : 'text-[14px]'} block truncate text-[#0D47A1]`">{{ safeProduct().name }}</strong>
  <strong class="product-summary__price">{{ formatCurrency(safeProduct().price) }}</strong>
  <div class="product-summary__row">
    <span class="product-summary__product-type">Loại: {{ productType() }}</span>
    <span class="product-summary__quantity">Số lượng: {{ safeProduct().quantity }}</span>
  </div>
</div>
