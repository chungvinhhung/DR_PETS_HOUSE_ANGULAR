<label class="order-pages-search-and-sort__label">
  <input
    [value]="searchInput() ?? ''"
    (input)="onSearchInputChange.emit($any($event).target.value)"
    placeholder="Tìm kiếm theo Mã đơn hàng, Thời gian đặt hàng hoặc tên sản phẩm"
    class="order-pages-search-and-sort__tim-kiem-theo-ma"
  />
  <button
    type="submit"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full transition hover:bg-[#FFF176]"
    aria-label="Tìm kiếm đơn hàng"
  >
    <img [attr.src]="productImages.searchIcon" alt="" class="order-pages-search-and-sort__search-icon" />
  </button>
</label>
<label class="order-pages-search-and-sort__label-2">
  <svg class="h-4 w-[18px] shrink-0 text-[#414141]" viewBox="0 0 18 12" aria-hidden="true">
    <path d="M1 1h16M1 6h10M1 11h5" stroke="currentColor" stroke-width="1.5" />
  </svg>
  <select
    [selectValue]="sortOrder()"
    (change)="onSortChange.emit($any($event).target.value)"
    class="order-pages-search-and-sort__sap-xep-don-hang"
    aria-label="Sắp xếp đơn hàng"
  >
    <option value="newest">Mới nhất</option>
    <option value="oldest">Cũ nhất</option>
  </select>
</label>
