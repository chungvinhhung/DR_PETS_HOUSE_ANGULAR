<div class="hero-slide-layer__layer">
  <img [attr.src]="slide().background" alt="" [class]="`pointer-events-none ${slide().backgroundImgClass}`" />
</div>
<div [class]="`absolute rounded-[100px] bg-[#E6D445] ${slide().yellowInset}`"></div>
<div [class]="`${slide().petFrame} pointer-events-none`">
  <div class="hero-slide-layer__layer-2">
    <img
      [attr.src]="slide().petSrc"
      alt=""
      class="hero-slide-layer__pet-src"
    />
  </div>
</div>
