<div class="actions__row">
  <button
    type="button"
    (click)="action(onLikeFn)($event)"
    [class]="`flex items-center gap-2 ${liked() ? 'text-[#D32F2F]' : ''}`"
  >
    <app-customer-icon name="heart" className="h-[18px] w-5" [fill]="liked() ? 'currentColor' : 'none'" /> {{ post().likes }}</button>
  <button type="button" (click)="action(onCommentFn)($event)" class="flex items-center gap-2">
    <app-customer-icon name="message-square" className="h-5 w-5" /> {{ post().comments }}</button>
</div>
<div class="actions__row-2">
  <button type="button" (click)="action(onShareFn)($event)" aria-label="Chia sẻ"><app-customer-icon name="share-2" className="h-5 w-5" /></button>
</div>
