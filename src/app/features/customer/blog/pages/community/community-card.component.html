@if (post().image) {
  <img
    [attr.src]="post().image"
    alt=""
    [class]="`${post().featured ? 'h-[562px]' : 'h-64'} w-full object-cover`"
  />
}
@if (post().video) {
  <video
    [attr.src]="post().video"
    controls
    (click)="$any($event).stopPropagation()"
    class="h-64 w-full bg-black object-contain"
  ></video>
}
<div [class]="post().featured ? 'p-8' : 'p-6'">
  <div class="flex items-start justify-between">
    <div app-author [post]="post()" [large]="post().featured"></div>
    <app-type-badge [type]="post().type" />
  </div>
  @if (post().title) {
    <h3 class="mt-4 text-[16px] font-bold text-[rgba(0,0,0,0.87)]">{{ post().title }}</h3>
  }
  <!-- <div className={`mt-3 whitespace-pre-line text-[16px] leading-[26px] ${post.type === "Mẹo vặt" ? "italic text-[#1C4E4C]" : "text-[#414753]"}`}>{post.content}</div> -->
  <div class="mt-3 whitespace-pre-line text-[16px] leading-[26px] text-[#414753]">{{ post().content }}</div>
  @if (post().tags) {
    <div class="mt-4 flex flex-wrap gap-2">
      @for (tag of post().tags; track tag) {
        <span class="rounded-lg bg-[rgba(214,227,255,0.5)] px-2 py-0.5 text-[10px] font-semibold text-[#005AB4]">{{ tag }}</span>
      }
    </div>
  }
  <div class="mt-6">
    <div
      app-actions
      [post]="post()"
      [liked]="state().liked"
      (onLike)="onLike.emit($event)"
      (onComment)="onComment.emit($event)"
      (onShare)="onShare.emit($event)"
    ></div>
  </div>
</div>
