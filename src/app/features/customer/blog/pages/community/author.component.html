@if (post().avatar) {
  <img
    [attr.src]="post().avatar"
    alt=""
    [class]="`${large() ? 'h-12 w-12' : 'h-10 w-10'} rounded-full border-2 border-[#005AB4] object-cover`"
  />
} @else {
  <span class="flex h-10 w-10 items-center justify-center rounded-full bg-[#D7E2FF] text-[14px] font-semibold text-[#3E5E95]">{{ post().initials || post().author?.slice(0, 1) }}</span>
}
<div>
  <p [class]="`${large() ? 'text-[18px]' : 'text-[16px]'} font-semibold text-[#1A1C1C]`">{{ post().author }}</p>
  <p class="text-[12px] text-[#414753]">{{ post().time }}</p>
</div>
