<a
  [appCustomerLink]="`/blog/so-cuu/${post().id}`"
  [class]="`group relative overflow-hidden rounded-[32px] border border-[#D9E3F6] bg-white shadow-sm transition-all hover:-translate-y-1 hover:shadow-lg ${
        isUrgent() ? 'col-span-8 min-h-[420px]' : 'col-span-4 min-h-[300px]'
      }`"
>
  <div [class]="`${isUrgent() ? 'grid h-full grid-cols-2' : 'flex h-full flex-col'}`">
    @if (hasImage()) {
      <div [class]="`relative overflow-hidden ${isUrgent() ? 'h-full' : 'h-[178px]'}`">
        <img
          [attr.src]="post().image"
          alt=""
          class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-[1.03]"
        />
        @if (post().urgent) {
          <span class="absolute left-4 top-4 flex items-center gap-2 rounded-full bg-[#FFDAD6] px-4 py-2 text-[12px] font-semibold uppercase tracking-[0.3px] text-[#C62828]">
            <app-customer-icon name="siren" className="h-4 w-4" /> Cấp cứu khẩn cấp</span>
        }
      </div>
    }
    <div [class]="`flex flex-1 flex-col justify-center ${isUrgent() ? 'p-10' : 'p-8'}`">
      <p class="text-[12px] font-semibold uppercase tracking-[0.3px] text-[#0D47A1]">{{ post().categoryLabel }}</p>
      <h2 [class]="`mt-3 font-semibold leading-tight text-[rgba(0,0,0,0.87)] ${isUrgent() ? 'text-[26px]' : 'text-[20px]'}`">{{ post().title }}</h2>
      <p class="mt-4 text-[14px] leading-5 text-[#414753]">{{ post().description }}</p>
      <span class="mt-6 flex items-center gap-2 text-[13px] font-semibold text-[#005AB4]">Đọc ngay <app-customer-icon
          name="arrow-right"
          className="h-4 w-4 transition-transform group-hover:translate-x-1"
        />
      </span>
    </div>
  </div>
</a>
