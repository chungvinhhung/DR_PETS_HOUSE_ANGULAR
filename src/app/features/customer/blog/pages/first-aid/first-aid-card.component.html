<a
  [appCustomerLink]="`/blog/so-cuu/${post().id}`"
  [class]="`group relative overflow-hidden rounded-[32px] border border-[#D9E3F6] bg-white shadow-sm transition-all hover:-translate-y-1 hover:shadow-lg ${
        isUrgent() ? 'md:col-span-12 lg:col-span-8 min-h-[420px]' : 'md:col-span-6 lg:col-span-4 min-h-[300px]'
      }`"
>
  <div [class]="`${isUrgent() ? 'grid h-full grid-cols-1 sm:grid-cols-2' : 'flex h-full flex-col'}`">
    @if (hasImage()) {
      <div [class]="`relative overflow-hidden ${isUrgent() ? 'h-[220px] sm:h-full' : 'h-[178px]'}`">
        <img
          [attr.src]="post().image"
          alt=""
          class="first-aid-card__image group-hover:scale-[1.03]"
        />
        @if (post().urgent) {
          <span class="first-aid-card__text">
            <app-customer-icon name="siren" className="h-4 w-4" /> Cấp cứu khẩn cấp</span>
        }
      </div>
    }
    <div [class]="`flex flex-1 flex-col justify-center ${isUrgent() ? 'p-6 sm:p-10' : 'p-6 sm:p-8'}`">
      <p class="first-aid-card__category-label">{{ post().categoryLabel }}</p>
      <h2 [class]="`mt-3 font-semibold leading-tight text-[rgba(0,0,0,0.87)] ${isUrgent() ? 'text-[26px]' : 'text-[20px]'}`">{{ post().title }}</h2>
      <p class="first-aid-card__description">{{ post().description }}</p>
      <span class="first-aid-card__doc-ngay-text">Đọc ngay <app-customer-icon
          name="arrow-right"
          className="h-4 w-4 transition-transform group-hover:translate-x-1"
        />
      </span>
    </div>
  </div>
</a>
