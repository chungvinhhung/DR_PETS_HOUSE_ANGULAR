<a
  [appCustomerLink]="href()"
  class="featured-post__href-link group flex bg-white hover:-translate-y-0.5"
>
  <div class="featured-post__box">
    <img [attr.src]="post().image" [attr.alt]="post().title" class="featured-post__title" />
    <div class="featured-post__layer">
      <app-customer-icon name="sparkles" className="h-3 w-3" /> Nổi bật</div>
  </div>
  <div class="featured-post__stack">
    <p class="featured-post__text">
      <app-category-icon [category]="post().category" [className]="'h-[17px] w-[17px]'" />{{ post().categoryLabel }}</p>
    <h2 class="featured-post__title-2">{{ post().title }}</h2>
    <p class="featured-post__excerpt">{{ post().excerpt }}</p>
    <div class="featured-post__row">
      <div class="featured-post__row-2">
        <img
          [attr.src]="post().authorImage"
          alt=""
          class="featured-post__author-image"
        />
        <div>
          <p class="featured-post__author">{{ post().author }}</p>
          <p class="featured-post__text-2">
            <app-customer-icon name="calendar-days" className="h-3 w-3" /> {{ post().publishedAt }}</p>
        </div>
      </div>
      <span class="featured-post__text-3 group-hover:scale-105">
        <app-customer-icon name="arrow-right" className="h-4 w-4" />
      </span>
    </div>
  </div>
</a>
