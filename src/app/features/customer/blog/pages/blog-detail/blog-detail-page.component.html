<div app-canvas-layout>
  <app-nav-bar />
  <main class="blog-detail-page__main">
    <nav
      app-breadcrumb
      [items]="[
            { label: 'Trang chủ', to: '/' },
            { label: 'Blog', to: '/blog' },
            { label: section().label, to: section().href },
            { label: post().categoryLabel, to: `${section().href}?category=${post().category}#latest-posts` },
            { label: post().title }
          ]"
      [variant]="'blog'"
      [className]="'w-full max-w-page'"
    ></nav>
    <div class="blog-detail-page__stack">
      <div class="blog-detail-page__stack-2">
        @if (isLoading()) {
          <div class="blog-detail-page__dang-tai-bai-el">Đang tải bài viết...</div>
        }
        @if (loadError()) {
          <div class="blog-detail-page__dang-tai-bai-el">{{ loadError() }}</div>
        }
        <article app-article [post]="post()"></article>
      </div>
      <aside app-blog-sidebar [selectedCategory]="post().category"></aside>
    </div>
    <section class="blog-detail-page__section">
      <div app-section-heading>Sản phẩm liên quan</div>
      @if (productNotice()) {
        <p class="blog-detail-page__product-notice">{{ productNotice() }}</p>
      }
      <div class="blog-detail-page__grid">
        @for (product of relatedProducts(); track product.id) {
          <app-shopping-product-card [product]="product" [href]="'/product-details'" />
        }
      </div>
    </section>
    <app-related-blog-section [posts]="relatedPosts().length ? relatedPosts() : ALL_BLOG_POSTS" />
  </main>
  <app-footer [variant]="'white'" />
</div>
