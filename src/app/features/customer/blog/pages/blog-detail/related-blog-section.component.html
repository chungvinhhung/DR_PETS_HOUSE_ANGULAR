@if (!(!posts().length)) {
  <section class="w-full max-w-[1200px]">
    <div app-section-heading>Bài viết liên quan</div>
    <div class="relative mt-6 grid grid-cols-1 justify-items-center gap-6 sm:grid-cols-2 lg:flex lg:justify-between">
      @for (post of visible(); track post.id) {
        <article app-blog-card [post]="post"></article>
      }
      <button
        type="button"
        (click)="handle1()"
        class="absolute -left-2 top-[143px] z-10 flex h-10 w-10 lg:-left-14 lg:h-14 lg:w-14 items-center justify-center rounded-full bg-[#FDD835] text-[#0D47A1]"
      >
        <app-customer-icon name="chevron-left" className="h-5 w-5" />
      </button>
      <button
        type="button"
        (click)="handle2()"
        class="absolute -right-2 top-[143px] z-10 flex h-10 w-10 lg:-right-14 lg:h-14 lg:w-14 items-center justify-center rounded-full bg-[#FDD835] text-[#0D47A1]"
      >
        <app-customer-icon name="chevron-right" className="h-5 w-5" />
      </button>
    </div>
  </section>
}
