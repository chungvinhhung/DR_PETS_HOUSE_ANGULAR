@if (!(!posts().length)) {
  <section class="related-section__section">
    <div class="related-section__row">
      <h2 class="related-section__cac-kien-thuc-title">Các kiến thức sơ cứu quan trọng khác</h2>
      <div class="related-section__box"></div>
    </div>
    <div class="related-section__grid">
      @for (post of visiblePosts(); track post.id) {
        <a
          [appCustomerLink]="`/blog/so-cuu/${post.id}`"
          class="related-section__id-link group flex bg-white hover:-translate-y-1"
        >
          @if (post.image) {
            <img [attr.src]="post.image" alt="" class="related-section__image" />
          }
          <p class="related-section__category-label">{{ post.categoryLabel }}</p>
          <h3 class="related-section__title">{{ post.title }}</h3>
          <p class="related-section__description">{{ post.description }}</p>
          <span class="related-section__doc-ngay-text">Đọc ngay <app-customer-icon
              name="arrow-right"
              className="h-4 w-4 transition-transform group-hover:translate-x-1"
            />
          </span>
        </a>
      }
      <button
        type="button"
        (click)="move(-1)"
        class="absolute -left-2 top-1/2 z-10 flex h-10 w-10 lg:-left-12 lg:h-12 lg:w-12 -translate-y-1/2 items-center justify-center rounded-full bg-[#FDD835]"
        aria-label="Bài trước"
      >
        <app-customer-icon name="chevron-left" />
      </button>
      <button
        type="button"
        (click)="move(1)"
        class="absolute -right-2 top-1/2 z-10 flex h-10 w-10 lg:-right-12 lg:h-12 lg:w-12 -translate-y-1/2 items-center justify-center rounded-full bg-[#FDD835]"
        aria-label="Bài tiếp theo"
      >
        <app-customer-icon name="chevron-right" />
      </button>
    </div>
  </section>
}
