<div class="flex items-center gap-[30px]">
  <h2 class="text-[32px] font-semibold leading-10 tracking-[-0.32px] text-[#121C2A]">Các bước sơ cứu tại chỗ</h2>
  <div class="flex gap-2">
    @for (label of ['Thực hiện chậm', 'Quan sát kỹ']; track label) {
      <span class="rounded-full bg-[#C62828] px-4 py-1 text-[14px] font-semibold leading-5 tracking-[0.28px] text-white">{{ label }}</span>
    }
  </div>
</div>
<ol class="mt-10 grid grid-cols-3 gap-6">
  @for (step of steps(); track step.title; let index = $index) {
    <li class="min-h-[342px] rounded-[32px] border border-[#7A8494] bg-white p-6">
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-[#FDD835] text-[24px] font-semibold text-[#005AB4]">{{ index + 1 }}</span>
      <h3 class="mt-2 text-[24px] font-semibold leading-8 text-[#005AB4]">{{ step.title }}</h3>
      <p class="mt-2 text-[16px] leading-[26px]">{{ step.description }}</p>
    </li>
  }
</ol>
