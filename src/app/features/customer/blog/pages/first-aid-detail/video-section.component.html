<div class="w-[532px]">
  <h2 class="text-[32px] font-semibold leading-10">{{video()?.title}}</h2>
  @if (video()?.description) {
    <p class="mt-4 text-[16px] leading-6">{{video().description}}</p>
  }
  @if (video()?.highlights?.length) {
    <ul class="mt-4 space-y-2">
      @for (item of video().highlights; track item) {
        <li class="flex items-center gap-2 text-[16px] leading-6">
          <app-customer-icon name="check-circle-2" className="h-4 w-4" /> {{item}}
        </li>
      }
    </ul>
  }
</div>
@if (validUrl()) {
  @if (directMedia()) {
    <video controls preload="metadata"
      class="ml-10 h-[281px] w-[500px] rounded-[32px] bg-black"
      [src]="video().url">
      Trình duyệt không hỗ trợ phát video này.
    </video>
  } @else {
    <a [href]="video().url" target="_blank" rel="noopener noreferrer"
      class="ml-10 flex h-[281px] w-[500px] items-center justify-center gap-3 rounded-[32px] border border-[#C1C6D5] bg-black text-white"
      aria-label="Mở video hướng dẫn trên trang nguồn">
      <app-customer-icon name="play" className="h-7 w-7" /> Mở video hướng dẫn
    </a>
  }
}
