<div app-canvas-layout>
  <app-nav-bar />
  <main class="first-aid-detail-page__main">
    <div class="first-aid-detail-page__box">
      <nav
        app-breadcrumb
        [variant]="'blog'"
        [items]="[
              { label: 'Trang chủ', to: '/' },
              { label: 'Blog', to: '/blog' },
              { label: 'Cẩm nang sơ cứu', to: '/blog/so-cuu' },
              { label: detail().categoryLabel, to: `/blog/so-cuu?category=${detail().category}` },
              { label: detail().title }
            ]"
      ></nav>
      <section class="first-aid-detail-page__section">
        <div class="first-aid-detail-page__box-2">
          <img [attr.src]="detail().image" alt="" class="first-aid-detail-page__image" />
          <div class="first-aid-detail-page__layer"></div>
          <div class="first-aid-detail-page__stack">
            <span class="first-aid-detail-page__text">
              <app-customer-icon name="siren" className="h-4 w-4" /> CẤP CỨU KHẨN CẤP</span>
            <h1 class="first-aid-detail-page__hero-title">{{ detail().heroTitle }}</h1>
            <p class="first-aid-detail-page__description">{{ detail().description }}</p>
          </div>
        </div>
        <div class="first-aid-detail-page__box-3"><aside app-emergency-support></aside></div>
      </section>
      @if (isLoading()) {
        <div class="first-aid-detail-page__dang-tai-huong-el">Đang tải hướng dẫn sơ cứu...</div>
      }
      @if (loadError()) {
        <div class="first-aid-detail-page__dang-tai-huong-el">{{ loadError() }}</div>
      }
      <  @if (detail().steps?.length) {
        <section app-step-section [steps]="detail().steps" [badges]="detail().stepBadges || []"></section>
      }
      <section app-video-section [video]="detail().video"></section>
      <app-related-section [currentId]="detail().id" [posts]="relatedPosts()" />
    </div>
  </main>
  <app-footer [variant]="'white'" />
</div>
