<div class="medical-section-title medical-services__title">
  <h2>Dịch vụ<br />chúng tôi cung cấp</h2>
  <img [attr.src]="medicalAssets.servicesTitleShape" alt="" />
</div>
<div class="medical-services__decor"><img [attr.src]="medicalAssets.servicesDecor" alt="" /></div>
<img class="medical-services__paw" [attr.src]="medicalAssets.servicesPaw" alt="" aria-hidden="true" />
<div class="medical-services__grid">
  @for (service of services(); track service.title; let index = $index, count = $count) {
    <article class="medical-service-card" [class.medical-service-card--center]="isCenteredLast(index, count)">
      <div
        class="medical-service-card__media"
        [appStyle]="{
              WebkitMaskImage: `url(${medicalAssets.serviceCardMask})`,
              maskImage: `url(${medicalAssets.serviceCardMask})`
            }"
      >
        <img [attr.src]="service.image" [attr.alt]="service.title" [style.object-position]="service.imagePosition || 'center'" />
        <div class="medical-service-card__shade"></div>
      </div>
      <div class="medical-service-card__number" aria-hidden="true"><div><span>{{ index + 1 }}</span></div></div>
      <div class="medical-service-card__copy">
        <h3>{{ service.title }}</h3>
        <em>{{ service.price }}</em>
        <p>{{ service.description }}</p>
      </div>
    </article>
  }
</div>
