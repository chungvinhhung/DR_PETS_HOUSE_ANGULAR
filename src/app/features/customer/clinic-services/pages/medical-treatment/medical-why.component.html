<h2>Vì sao nên chọn Dr. Pet's House?</h2>
<div class="medical-why__layout">
  <div class="medical-why__column">
    @for (item of medicalWhyItems.slice(0, 4); track item.title) {
      <article app-why-item [item]="item" [align]="'left'"></article>
    }
  </div>
  <div class="medical-why__main">
    <div class="medical-why__main-bg"></div>
    <div class="medical-why__main-photo"><img [attr.src]="medicalAssets.whyMain" alt="Đội ngũ bác sĩ chăm sóc thú cưng" /></div>
  </div>
  <div class="medical-why__column">
    @for (item of medicalWhyItems.slice(4); track item.title) {
      <article app-why-item [item]="item" [align]="'right'"></article>
    }
  </div>
</div>
<img class="medical-why__decor medical-why__decor--paw" [attr.src]="medicalAssets.whyPaw" alt="" />
<img
  class="medical-why__decor medical-why__decor--group-left"
  [attr.src]="medicalAssets.whyGroupLeft"
  alt=""
/>
<img
  class="medical-why__decor medical-why__decor--group-right"
  [attr.src]="medicalAssets.whyGroupRight"
  alt=""
/>
<img class="medical-why__decor medical-why__decor--vector" [attr.src]="medicalAssets.whyVector" alt="" />
<img class="medical-why__decor medical-why__decor--vector-1" [attr.src]="medicalAssets.whyVector1" alt="" />
<img class="medical-why__decor medical-why__decor--vector-2" [attr.src]="medicalAssets.whyVector2" alt="" />
<img class="medical-why__decor medical-why__decor--vector-3" [attr.src]="medicalAssets.whyVector3" alt="" />
<img class="medical-why__decor medical-why__decor--vector-4" [attr.src]="medicalAssets.whyVector4" alt="" />
