<section
  id="danh-sach-dich-vu"
  class="flex w-full flex-col items-center gap-6 border-[rgba(0,0,0,0.1)] pt-[28px]"
  [appStyle]="{ height: 1651 }"
>
  <div class="relative h-[162px] w-[1440px] shrink-0">
    <h2
      class="absolute left-1/2 top-[89.5px] w-[1440px] -translate-x-1/2 -translate-y-1/2"
      [appStyle]="groomingTitleStyles.primary64"
    >Dịch vụ<br />chúng tôi cung cấp</h2>
    <img
      [attr.src]="groomingImages.serviceBgShape"
      alt=""
      class="pointer-events-none absolute left-[990px] top-[3px] h-[87px] w-[105px]"
      aria-hidden="true"
    />
  </div>
  <div class="relative h-[1572px] w-full shrink-0">
    <img
      [attr.src]="groomingImages.servicesDecor"
      alt=""
      class="pointer-events-none absolute left-[calc(50%+702.61px)] top-[59.86%] h-[129px] w-[129px] -translate-x-1/2 -rotate-[20deg] object-cover"
      aria-hidden="true"
    />
    @for (service of GROOMING_SERVICES; track $index) {
      @let pos = compute1(service);
      <div class="absolute" [appStyle]="{ left: pos.x, top: pos.y }"><div app-service-card [service]="service"></div></div>
    }
  </div>
</section>
