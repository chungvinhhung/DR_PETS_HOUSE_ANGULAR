<section
  class="relative h-[897px] w-[1440px] overflow-hidden bg-white"
  [appStyle]="{
        backgroundImage: `url(${groomingImages.whyusBgFull}), linear-gradient(90deg, #fff 0%, #fff 100%)`,
        backgroundSize: '1440px 774px, auto',
        backgroundRepeat: 'no-repeat, repeat',
        backgroundPosition: 'top left, 0 0'
      }"
>
  <img
    [attr.src]="groomingImages.whyusOrnament"
    alt=""
    class="pointer-events-none absolute left-[67px] top-[24px] h-[55px] w-[202px] rotate-[145.99deg]"
    aria-hidden="true"
  />
  <img
    [attr.src]="groomingImages.whyusPawPrint"
    alt=""
    class="pointer-events-none absolute left-[1245px] top-[94px] h-[96px] w-[103px] -rotate-[19.75deg]"
    aria-hidden="true"
  />
  <h2 class="absolute left-[160px] top-[72px] w-[1106px]" [appStyle]="groomingTitleStyles.dark56Center">Hãy để chúng tôi giúp bé cưng của bạn</h2>
  <p
    class="absolute left-[174px] top-[147px] w-[1077px] text-center text-[#0F172A]"
    [appStyle]="{
          fontFamily: 'Roboto, sans-serif',
          fontWeight: 400,
          fontSize: 24,
          lineHeight: 1.334
        }"
  >Bé cưng của bạn hạnh phúc, chúng tôi tự hào. Hãy để chúng tôi đồng hành cùng bạn!</p>
  <div class="absolute left-[160px] top-[237px] size-[316px] overflow-hidden rounded-[44px] bg-white">
    <img [attr.src]="groomingImages.whyusMain" alt="" class="size-full object-cover" />
  </div>
  <div class="absolute left-[299px] top-[469px] h-[315px] w-[318px] overflow-hidden rounded-[46px] bg-white">
    <img [attr.src]="groomingImages.whyusSecondary" alt="" class="size-full rounded-[50px] object-cover" />
  </div>
  @for (prop of GROOMING_VALUE_PROPS; track prop.num) {
    <app-value-prop-card [prop]="prop" />
  }
</section>
