<section
  class="grooming-why-us__section"
  [appStyle]="{
        backgroundImage: `url(${groomingImages.whyusBgFull}), linear-gradient(90deg, #fff 0%, #fff 100%)`,
        backgroundSize: '1440px 774px, auto',
        backgroundRepeat: 'no-repeat, repeat',
        backgroundPosition: 'top left, 0 0'
      }"
>
  <img
    [attr.src]="groomingImages.whyusOrnament"
    alt=""
    class="pointer-events-none absolute left-[67px] top-[24px] h-[55px] w-[202px] rotate-[145.99deg]"
    aria-hidden="true"
  />
  <img
    [attr.src]="groomingImages.whyusPawPrint"
    alt=""
    class="pointer-events-none absolute left-[1245px] top-[94px] h-[96px] w-[103px] -rotate-[19.75deg]"
    aria-hidden="true"
  />
  <h2 class="grooming-why-us__hay-de-chung-title" [appStyle]="groomingTitleStyles.dark56Center">Hãy để chúng tôi giúp bé cưng của bạn</h2>
  <p
    class="grooming-why-us__be-cung-cua-text"
    [appStyle]="{
          fontFamily: 'Roboto, sans-serif',
          fontWeight: 400,
          fontSize: 24,
          lineHeight: 1.334
        }"
  >Bé cưng của bạn hạnh phúc, chúng tôi tự hào. Hãy để chúng tôi đồng hành cùng bạn!</p>
  <div class="grooming-why-us__layer">
    <img [attr.src]="groomingImages.whyusMain" alt="" class="grooming-why-us__whyus-main" />
  </div>
  <div class="grooming-why-us__layer-2">
    <img [attr.src]="groomingImages.whyusSecondary" alt="" class="grooming-why-us__whyus-secondary" />
  </div>
  @for (prop of GROOMING_VALUE_PROPS; track prop.num) {
    <app-value-prop-card [prop]="prop" />
  }
</section>
