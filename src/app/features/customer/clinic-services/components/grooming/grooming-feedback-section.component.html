<img
  [attr.src]="groomingFeedbackAssets.background"
  alt=""
  class="grooming-feedback-section__background"
/>
<div class="grooming-feedback-section__box">
  <h2 class="grooming-feedback-section__phan-hoi-cua-title" [appStyle]="groomingTitleStyles.dark64">Phản hồi của khách hàng</h2>
  <div class="grooming-feedback-section__box-2">
    <div
      [class]="`grid h-full grid-cols-3 items-stretch gap-[10px] ${slideOffset()}`"
      role="tabpanel"
      aria-live="polite"
      [attr.aria-label]="`Trang ${pageIndex() + 1} / ${FEEDBACK_PAGE_COUNT}`"
    >
      @for (review of FEEDBACK_PAGES[pageIndex()]; track review.id) {
        <article app-grooming-feedback-section-feedback-card [review]="review"></article>
      }
    </div>
  </div>
  <div
    class="grooming-feedback-section__chon-trang-phan-hoi"
    role="tablist"
    aria-label="Chọn trang phản hồi"
  >
    <button
      type="button"
      (click)="goPrev()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100"
      aria-label="Trang phản hồi trước"
    >
      <img [attr.src]="groomingFeedbackAssets.carouselLeft" alt="" class="grooming-feedback-section__carousel-left" />
    </button>
    <div class="grooming-feedback-section__row">
      @for (_ of range1(); track $index; let idx = $index) {
        <button
          app-grooming-feedback-section-feedback-dot
          [pageIndex]="idx"
          [totalPages]="FEEDBACK_PAGE_COUNT"
          [isActive]="idx === pageIndex()"
          (onClick)="goToPage(idx)"
        ></button>
      }
    </div>
    <button
      type="button"
      (click)="goNext()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100"
      aria-label="Trang phản hồi tiếp"
    >
      <img
        [attr.src]="groomingFeedbackAssets.carouselRight"
        alt=""
        class="grooming-feedback-section__carousel-left"
      />
    </button>
  </div>
</div>
<img
  [attr.src]="groomingFeedbackAssets.pawSmall"
  alt=""
  class="grooming-feedback-section__paw-small"
/>
<img
  [attr.src]="groomingFeedbackAssets.pawSmall"
  alt=""
  class="grooming-feedback-section__paw-small-2"
/>
<img
  [attr.src]="groomingFeedbackAssets.pawBlue"
  alt=""
  class="grooming-feedback-section__paw-blue"
/>
<img
  [attr.src]="groomingFeedbackAssets.pawBlue"
  alt=""
  class="grooming-feedback-section__paw-blue-2"
/>
<img
  [attr.src]="groomingFeedbackAssets.pawBlueSmall"
  alt=""
  class="grooming-feedback-section__paw-blue-small"
/>
<img
  [attr.src]="groomingFeedbackAssets.pawDark"
  alt=""
  class="grooming-feedback-section__paw-dark"
/>
