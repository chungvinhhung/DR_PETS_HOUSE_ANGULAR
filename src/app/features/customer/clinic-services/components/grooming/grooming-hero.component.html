<svg
  class="pointer-events-none absolute left-0 top-0 z-0 h-[615px] w-[1440px]"
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="615"
  viewBox="0 0 1440 615"
  fill="none"
  aria-hidden="true"
>
  <path
    d="M10.4924 836.766C18.707 838.606 27.2609 838.252 35.2958 835.742L1022.57 527.257C1026.38 526.069 1030.31 525.359 1034.29 525.143L1240.64 513.961C1251.26 513.385 1261.4 509.292 1269.45 502.327L1296.28 479.104C1304.53 471.964 1314.97 467.848 1325.88 467.435L1341.54 466.841C1361.66 466.079 1379.16 452.846 1385.38 433.699L1441.03 262.329C1443.01 256.221 1443.75 249.777 1443.19 243.378L1403.21 -219.912C1400.58 -250.371 1370.53 -270.644 1341.3 -261.671L85.568 123.852C67.324 129.453 54.1313 145.33 51.9655 164.291L-10.6115 712.143C-11.2518 717.748 -12.8754 723.197 -15.4077 728.239L-34.1895 765.634C-48.207 793.543 -32.2604 827.194 -1.78368 834.018L10.4924 836.766Z"
    fill="#E5F6FD"
  />
</svg>
<div class="grooming-hero__row">
  <div class="grooming-hero__stack">
    <h1 [appStyle]="groomingTitleStyles.hero">Dịch vụ<br />Grooming &amp; Spa</h1>
    <p
      class="grooming-hero__dich-vu-tam-text"
      [appStyle]="{
            fontFamily: 'Roboto, sans-serif',
            fontWeight: 400,
            fontSize: 24,
            lineHeight: 1.334
          }"
    >Dịch vụ tắm sấy, cắt tỉa lông và chăm sóc vệ sinh giúp thú cưng luôn sạch sẽ, khỏe mạnh và thoải mái.</p>
    <div class="grooming-hero__row-2">
      <a appCustomerLink="/dat-lich" class="grooming-hero__focus-ring-brand focus-ring-brand group">
        <img
          [attr.src]="groomingImages.heroPaw"
          alt=""
          class="pointer-events-none absolute -left-[54px] -top-[43px] h-[65.801px] w-[59.964px] -rotate-[25deg] translate-y-2 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100 group-focus-visible:translate-y-0 group-focus-visible:opacity-100"
          aria-hidden="true"
        />
        <span
          class="grooming-hero__dat-lich-ngay-text"
          [appStyle]="{
                fontFamily: 'Roboto, sans-serif',
                fontWeight: 700,
                fontSize: 15,
                lineHeight: '26px',
                letterSpacing: '0.46px',
                textTransform: 'uppercase',
                color: 'rgba(0, 0, 0, 0.87)'
              }"
        >ĐẶT LỊCH NGAY</span>
      </a>
      <a
        href="#danh-sach-dich-vu"
        class="grooming-hero__focus-ring-brand-2 focus-ring-brand"
        [appStyle]="{
              fontFamily: 'Roboto, sans-serif',
              fontWeight: 700,
              fontSize: 15,
              lineHeight: '26px',
              letterSpacing: '0.46px',
              textTransform: 'uppercase',
              color: 'rgba(0, 0, 0, 0.87)'
            }"
      >Bắt đầu thôi</a>
    </div>
  </div>
  <!-- Figma: ảnh chó + nền vàng — căn giữa cột phải, cách nền trắng 87px trên/dưới -->
  <div class="grooming-hero__figma-anh-cho-nen">
    <img
      [attr.src]="groomingImages.heroPetComposite"
      alt="Grooming & Spa"
      class="grooming-hero__grooming-spa"
    />
  </div>
</div>
