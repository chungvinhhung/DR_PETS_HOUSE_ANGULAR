<div class="service-card__layer" [appStyle]="mask()">
  <img
    [attr.src]="service().image"
    [attr.alt]="service().title"
    class="service-card__title group-hover:scale-[1.025]"
  />
</div>
<div
  class="service-card__layer-2"
  [appStyle]="mask()"
></div>
<div
  class="service-card__layer-3"
  [appStyle]="{
        right: 0,
        top: 8,
        width: 59,
        height: 59,
        transform: 'rotate(-36.71deg)'
      }"
>
  <div class="service-card__row">
    <span
      class="service-card__id"
      [appStyle]="{
            fontFamily: 'Roboto, sans-serif',
            fontWeight: 400,
            fontSize: 24,
            lineHeight: 1.334
          }"
    >{{ service().id }}</span>
  </div>
</div>
<div class="service-card__layer-4">
  <p
    class="service-card__title-2"
    [appStyle]="{
          fontFamily: 'Roboto, sans-serif',
          fontWeight: 400,
          fontSize: 24,
          lineHeight: '34.01px'
        }"
  >{{ service().title }}</p>
  <p
    class="service-card__price"
    [appStyle]="{
          fontFamily: 'Roboto, sans-serif',
          fontWeight: 300,
          fontSize: 16,
          lineHeight: '28px'
        }"
  >{{ service().price }}</p>
  <p
    class="service-card__description"
    [appStyle]="{
          fontFamily: 'Roboto, sans-serif',
          fontWeight: 400,
          fontSize: 16,
          lineHeight: '28px'
        }"
  >{{ service().description }}</p>
</div>
