<app-product-rating [value]="review().rating ?? 5" [size]="16" [gap]="8" [fillColor]="'#FF9D00'" />
<div
  class="review-card__box"
  [appStyle]="{
        fontFamily: 'Roboto, sans-serif',
        fontWeight: 400,
        fontSize: 16,
        lineHeight: 1.75,
        letterSpacing: '0.15px'
      }"
>
  @for (line of review().lines; track $index; let index = $index) {
    <p class="review-card__line">
      @if (index === 0) {
        {{ `"${line}` }}
      } @else {
        {{ line }}
      }
      @if (index === review().lines.length - 1) {
        "
      }
    </p>
  }
</div>
<div class="review-card__row">
  <img [attr.src]="groomingImages.feedbackAvatar" alt="" class="review-card__feedback-avatar" />
  <div class="review-card__stack">
    <span
      class="review-card__author"
      [appStyle]="{
            fontFamily: 'Fredoka, sans-serif',
            fontWeight: 500,
            fontSize: 24,
            lineHeight: '24px'
          }"
    >{{ review().author }}</span>
    <span
      class="review-card__company"
      [appStyle]="{
            fontFamily: 'Onest, sans-serif',
            fontWeight: 400,
            fontSize: 16,
            lineHeight: '28px'
          }"
    >{{ review().company }}</span>
  </div>
</div>
