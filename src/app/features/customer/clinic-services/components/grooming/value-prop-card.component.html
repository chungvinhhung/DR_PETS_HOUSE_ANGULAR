<article
  class="group absolute left-[658px] h-[171px] w-[645px] transition-transform duration-200 hover:translate-x-1"
  [appStyle]="{ top: prop().top }"
>
  <div class="absolute inset-0" [appStyle]="cssMask(groomingImages.whyusCardMask, '645px 171px')">
    <div class="absolute inset-x-0 top-[13px] h-[148px] rounded-[10px] bg-[#FBF6EA]"></div>
  </div>
  <div class="relative flex h-full gap-[18px] pl-[46px] pr-[52px] pt-[26px]">
    <img
      [attr.src]="groomingImages.checkmark"
      alt=""
      class="mt-1 size-[33px] shrink-0 transition-transform duration-200 group-hover:scale-110"
      aria-hidden="true"
    />
    <div class="min-w-0 flex-1">
      <h3
        class="line-clamp-2 pr-2 text-black"
        [appStyle]="{
              fontFamily: 'Roboto, sans-serif',
              fontWeight: 700,
              fontSize: 24,
              lineHeight: 1.25
            }"
      >{{ prop().title }}</h3>
      <p
        class="mt-1 line-clamp-3 text-black"
        [appStyle]="{
              fontFamily: 'Roboto, sans-serif',
              fontWeight: 400,
              fontSize: 14,
              lineHeight: 1.43,
              letterSpacing: '0.17px'
            }"
      >{{ prop().desc }}</p>
    </div>
    <span
      class="absolute right-[8px] top-[12px] text-[#02000F]"
      [appStyle]="{
            fontFamily: 'Roboto, sans-serif',
            fontWeight: 500,
            fontSize: 32,
            lineHeight: '26px'
          }"
    >{{ prop().num }}</span>
  </div>
</article>
