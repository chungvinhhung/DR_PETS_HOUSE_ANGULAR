<article
  class="value-prop-card__card group hover:translate-x-1"
  [appStyle]="{ top: prop().top }"
>
  <div class="value-prop-card__layer" [appStyle]="cssMask(groomingImages.whyusCardMask, '645px 171px')">
    <div class="value-prop-card__layer-2"></div>
  </div>
  <div class="value-prop-card__row">
    <img
      [attr.src]="groomingImages.checkmark"
      alt=""
      class="mt-1 size-[33px] shrink-0 transition-transform duration-200 group-hover:scale-110"
      aria-hidden="true"
    />
    <div class="value-prop-card__box">
      <h3
        class="value-prop-card__title"
        [appStyle]="{
              fontFamily: 'Roboto, sans-serif',
              fontWeight: 700,
              fontSize: 24,
              lineHeight: 1.25
            }"
      >{{ prop().title }}</h3>
      <p
        class="value-prop-card__desc"
        [appStyle]="{
              fontFamily: 'Roboto, sans-serif',
              fontWeight: 400,
              fontSize: 14,
              lineHeight: 1.43,
              letterSpacing: '0.17px'
            }"
      >{{ prop().desc }}</p>
    </div>
    <span
      class="value-prop-card__num"
      [appStyle]="{
            fontFamily: 'Roboto, sans-serif',
            fontWeight: 500,
            fontSize: 32,
            lineHeight: '26px'
          }"
    >{{ prop().num }}</span>
  </div>
</article>
