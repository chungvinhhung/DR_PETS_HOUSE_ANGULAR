<app-masked-blue-panel [maskUrl]="maskUrl()" [maskSize]="'100% 100%'" />
<div class="small-combo-card__grid">
  <img [attr.src]="image()" alt="" class="small-combo-card__image" />
  <div class="small-combo-card__stack">
    <h3 class="small-combo-card__title">{{ title() }}</h3>
    <p class="small-combo-card__price">{{ price() }}</p>
    <p class="small-combo-card__description">{{ description() }}</p>
  </div>
</div>
<app-book-button [className]="'absolute bottom-[-2px] right-[2px] w-[181.77px]'" />
