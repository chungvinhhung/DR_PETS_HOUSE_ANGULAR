<section class="w-full max-w-[460px] rounded-xl bg-white p-6 shadow-[0_20px_60px_rgba(6,16,90,0.18)]">
  <div class="mb-5 flex items-center justify-between gap-4">
    <h2 class="text-xl font-bold text-[#003f87]">Đổi mật khẩu</h2>
    <button
      type="button"
      (click)="onClose.emit($event)"
      class="rounded px-2 py-1 text-xl leading-none hover:bg-slate-100"
    >x</button>
  </div>
  <form (submit)="handleSubmit($any($event))" class="grid gap-4">
    <label app-user-profile-field [label]="'Mật khẩu hiện tại'">
      <input
        type="password"
        [value]="form().oldPassword ?? ''"
        (input)="updateField('oldPassword', $any($event).target.value)"
        [class]="inputClass"
        autocomplete="current-password"
      />
    </label>
    <label app-user-profile-field [label]="'Mật khẩu mới'">
      <input
        type="password"
        [value]="form().newPassword ?? ''"
        (input)="updateField('newPassword', $any($event).target.value)"
        [class]="inputClass"
        autocomplete="new-password"
      />
    </label>
    <label app-user-profile-field [label]="'Xác nhận mật khẩu mới'">
      <input
        type="password"
        [value]="form().confirmPassword ?? ''"
        (input)="updateField('confirmPassword', $any($event).target.value)"
        [class]="inputClass"
        autocomplete="new-password"
      />
    </label>
    @if (error()) {
      <p class="rounded-lg bg-[#ffdad6] px-3 py-2 text-sm font-semibold text-[#ba1a1a]">{{ error() }}</p>
    }
    <div class="flex justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="onClose.emit($event)"
        class="rounded border border-[#c1c6d5] px-4 py-2 text-sm font-semibold hover:bg-slate-50"
      >Hủy</button>
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="btn-yellow h-[38px] px-[22px] py-1 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isSubmitting()) {
          Đang lưu...
        } @else {
          Lưu
        }
      </button>
    </div>
  </form>
</section>
