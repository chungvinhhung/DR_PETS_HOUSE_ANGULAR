<div class="address-card__row">
  <div class="address-card__row-2">
    <strong>{{ recipient() }}</strong>
    @if (address().isDefault) {
      <span class="address-card__mac-dinh-text">Mặc định</span>
    }
  </div>
  <div class="address-card__row-3">
    <button type="button" (click)="onEdit.emit(address())" class="hover:text-[#0d47a1]">Thay đổi</button>
    @if (!address().isDefault) {
      <button type="button" (click)="onSetDefault.emit(address().id)" class="text-[#0d47a1]">Đặt làm mặc định</button>
      <button type="button" (click)="onDelete.emit(address().id)" class="text-[#c62828]">Xóa</button>
    }
  </div>
</div>
<p class="address-card__phone">{{ address().phone }}</p>
<p>{{ addressLine() }}</p>
