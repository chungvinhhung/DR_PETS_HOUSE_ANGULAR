<div class="flex flex-col gap-2">
  <h2 class="text-xl font-black text-blue-900">CHI TIẾT ĐƠN HÀNG</h2>
  <p class="text-sm font-medium text-slate-600">Mã đơn hàng: {{ ORDER_CODE }}</p>
</div>
<div class="flex flex-col gap-4">
  <p class="text-xl font-black text-blue-900">SẢN PHẨM ĐÃ CHỌN</p>
  <div class="flex flex-col gap-3">
    @if (items().length > 0) {
      @for (item of items(); track item.id) {
        <div app-checkout-order-item [item]="item"></div>
      }
    } @else {
      <p class="py-6 text-sm text-slate-500">Không có sản phẩm nào được chọn.</p>
    }
  </div>
</div>
<div class="flex flex-col gap-3">
  <p class="text-sm font-bold text-slate-900">GHI CHÚ ĐƠN HÀNG</p>
  <input
    type="text"
    [value]="note() ?? ''"
    (input)="onNoteChange.emit($any($event).target.value)"
    class="h-11 w-full rounded-2xl border border-slate-300 bg-white px-4 text-sm text-slate-900 outline-none focus:border-blue-900"
    aria-label="Ghi chú đơn hàng"
  />
</div>
