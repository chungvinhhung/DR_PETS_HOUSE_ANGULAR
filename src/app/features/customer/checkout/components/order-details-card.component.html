<div class="order-details-card__stack">
  <h2 class="order-details-card__chi-tiet-don-title">CHI TIẾT ĐƠN HÀNG</h2>
  <p class="order-details-card__order-code">Mã đơn hàng: {{ ORDER_CODE }}</p>
</div>
<div class="order-details-card__stack-2">
  <p class="order-details-card__chi-tiet-don-title">SẢN PHẨM ĐÃ CHỌN</p>
  <div class="order-details-card__stack-3">
    @if (items().length > 0) {
      @for (item of items(); track item.id) {
        <div app-checkout-order-item [item]="item"></div>
      }
    } @else {
      <p class="order-details-card__khong-co-san-text">Không có sản phẩm nào được chọn.</p>
    }
  </div>
</div>
<div class="order-details-card__stack-3">
  <p class="order-details-card__ghi-chu-don-text">GHI CHÚ ĐƠN HÀNG</p>
  <input
    type="text"
    [value]="note() ?? ''"
    (input)="onNoteChange.emit($any($event).target.value)"
    class="h-11 w-full rounded-2xl border border-slate-300 bg-white px-4 text-sm text-slate-900 outline-none focus:border-blue-900"
    aria-label="Ghi chú đơn hàng"
  />
</div>
