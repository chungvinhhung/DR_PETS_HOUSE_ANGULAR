@if (mode() !== 'list') {
  <div
    app-address-form-modal
    [mode]="mode()"
    [address]="editingAddress()"
    (onClose)="mode.set('list')"
    (onSave)="handle1($any($event))"
  ></div>
} @else {
  <div
    class="address-change-modal__overlay"
    (click)="handle2($any($event))"
  >
    <div class="address-change-modal__stack">
      <section class="address-change-modal__section">
        <div class="address-change-modal__row">
          <img [attr.src]="checkoutImages.locationPin" alt="" class="address-change-modal__location-pin" />
          <h3 class="address-change-modal__danh-sach-dia-title">Danh sách địa chỉ</h3>
          <button
            type="button"
            (click)="onClose.emit($event)"
            aria-label="Đóng"
            class="flex h-[30px] w-[30px] items-center justify-center rounded-full text-[24px] font-light leading-none text-[#727780] hover:bg-slate-100 hover:text-[#00355F]"
          >×</button>
        </div>
        <app-address-list
          [addresses]="addresses()"
          (onEdit)="openForm($any($event))"
          (onSelect)="onSelect.emit($event)"
        />
        @if (saveError()) {
          <p class="address-change-modal__save-error">{{ saveError() }}</p>
        }
      </section>
      <button
        type="button"
        (click)="openForm(null)"
        class="h-[42px] rounded-[4px] bg-[#FFF176] px-[22px] text-[15px] font-medium uppercase leading-[26px] tracking-[0.46px] text-[rgba(0,0,0,0.87)] shadow-elevation hover:bg-[#FDD835]"
      >+ Thêm mới</button>
    </div>
  </div>
}
