<div class="checkout-order-item__row">
  <div class="checkout-order-item__box">
    <img
      [attr.src]="item().image || item().imageUrl || item().thumbnail || checkoutImages.product"
      [attr.alt]="item().name"
      class="checkout-order-item__name"
    />
  </div>
</div>
<div class="checkout-order-item__stack">
  <div class="checkout-order-item__row-2">
    <p class="checkout-order-item__name-2">{{ item().name }}</p>
    <p class="checkout-order-item__qty">{{ formatMoney(item().price * item().qty) }}</p>
  </div>
  <div class="checkout-order-item__row-3">
    <div class="checkout-order-item__row-4">
      <div class="checkout-order-item__row-5">
        <span>Biến thể:</span>
        <span>{{ item().type || item().variant_name || item().variant?.variant_name || 'Mặc định' }}</span>
      </div>
    </div>
    <div class="checkout-order-item__row-6">
      <span>x</span>
      <span>{{ item().qty }}</span>
    </div>
  </div>
</div>
