@if (!(!cartService.isOrderSuccessOpen())) {
  <div
    class="order-success-overlay__overlay-fade-in overlay-fade-in"
    role="dialog"
    aria-label="Đặt hàng thành công"
    aria-modal="true"
  >
    <div class="order-success-overlay__panel-slide-in panel-slide-in">
      <div class="order-success-overlay__box"></div>
      <div class="order-success-overlay__layer">
        <img [attr.src]="orderSuccessImages.successIcon" alt="" class="order-success-overlay__success-icon" />
        <div class="order-success-overlay__stack">
          <h2 class="order-success-overlay__dat-hang-thanh-title">Đặt hàng thành công</h2>
          <p class="order-success-overlay__don-dat-hang-text">Đơn đặt hàng của bạn đã được xác nhận. Xem chi tiết và theo dõi đơn hàng tại 'Đơn hàng của tôi'.</p>
        </div>
        <div class="order-success-overlay__row">
          <button
            type="button"
            (click)="handleGoHome()"
            class="btn-yellow px-[22px] py-2 normal-case tracking-[0.46px]"
          >
            <span class="order-success-overlay__tro-ve-trang-text">Trở về trang chủ</span>
          </button>
          <button
            type="button"
            (click)="handleOrderDetails()"
            class="btn-yellow-outline px-[22px] py-2 normal-case tracking-[0.46px]"
          >
            <span class="order-success-overlay__chi-tiet-don-text">chi tiết đơn hàng</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
