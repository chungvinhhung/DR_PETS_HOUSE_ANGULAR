<p class="text-sm font-bold text-slate-900">Phương thức thanh toán trực tuyến</p>
<div class="space-y-3">
  @for (method of ONLINE_PAYMENT_METHODS; track $index) {
    @let selected = cartService.onlineMethod() === method.id;
    <button
      type="button"
      (click)="cartService.setOnlineMethod(method.id)"
      [class]="`flex w-full items-center gap-4 rounded-2xl border-2 p-3 text-left transition duration-micro ${
              selected
                ? 'border-blue-900 bg-[#d5e4f3]'
                : 'border-transparent bg-white hover:border-blue-900'
            }`"
    >
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white shadow">
        <img [attr.src]="method.icon" alt="" class="h-6 w-6 object-contain" />
      </span>
      <span class="flex-1 text-base font-bold leading-6 text-slate-900">{{ method.label }}</span>
      @if (selected) {
        <span class="text-base font-black text-blue-900">✓</span>
      }
    </button>
  }
</div>
