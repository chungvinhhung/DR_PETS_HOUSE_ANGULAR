<p class="online-payment-methods__phuong-thuc-thanh-text">Phương thức thanh toán trực tuyến</p>
<div class="space-y-3">
  @for (method of ONLINE_PAYMENT_METHODS; track $index) {
    @let selected = cartService.onlineMethod() === method.id;
    <button
      type="button"
      (click)="cartService.setOnlineMethod(method.id)"
      [class]="`flex w-full items-center gap-4 rounded-2xl border-2 p-3 text-left transition duration-micro ${
              selected
                ? 'border-blue-900 bg-[#d5e4f3]'
                : 'border-transparent bg-white hover:border-blue-900'
            }`"
    >
      <span class="online-payment-methods__text">
        <img [attr.src]="method.icon" alt="" class="online-payment-methods__icon" />
      </span>
      <span class="online-payment-methods__label">{{ method.label }}</span>
      @if (selected) {
        <span class="online-payment-methods__text-2">✓</span>
      }
    </button>
  }
</div>
