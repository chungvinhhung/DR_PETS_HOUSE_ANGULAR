@if (addresses().length === 0) {
  <p class="address-list__chua-co-dia-text">Chưa có địa chỉ nào.</p>
} @else {
  <div class="address-list__stack">
    @for (address of addresses(); track address.id) {
      <div class="address-list__row">
        <button
          type="button"
          (click)="onSelect.emit(address)"
          class="flex min-w-0 flex-1 flex-col gap-[5px] text-left"
        >
          <span class="address-list__name">{{ address.name }} | {{ address.phone }}</span>
          <span class="address-list__display-address">{{ address.displayAddress || address.address }}</span>
          @if (address.isDefault) {
            <span class="address-list__mac-dinh-text">Mặc định</span>
          }
        </button>
        <button
          type="button"
          (click)="onEdit.emit(address)"
          class="shrink-0 px-1 text-[12px] leading-[20px] tracking-[0.4px] text-[#00355F] hover:underline"
        >Thay đổi</button>
      </div>
    }
  </div>
}
