@if (!(!cartService.isGuestSuccessOpen())) {
  <div
    class="guest-order-success-overlay__overlay-fade-in overlay-fade-in"
    role="dialog"
    aria-label="Đặt hàng thành công"
    aria-modal="true"
  >
    <div class="guest-order-success-overlay__panel-slide-in panel-slide-in">
      <div class="guest-order-success-overlay__layer">
        <img [attr.src]="guestSuccessImages.cardBackground" alt="" class="guest-order-success-overlay__card-background" />
      </div>
      <div class="guest-order-success-overlay__layer-2">
        <img [attr.src]="guestSuccessImages.successIcon" alt="" class="guest-order-success-overlay__success-icon" />
        <div class="guest-order-success-overlay__stack">
          <h2 class="guest-order-success-overlay__dat-hang-thanh-title">Đặt hàng thành công</h2>
          <p class="guest-order-success-overlay__don-dat-hang-text">Đơn đặt hàng của bạn đã được ghi nhận. Bạn có thể tra cứu và theo dõi đơn bất cứ lúc nào bằng số điện thoại/email đã dùng khi đặt hàng và mã OTP — không cần tài khoản.</p>
        </div>
        @if (orderCode()) {
          <div class="guest-order-success-overlay__stack-2">
            <div class="guest-order-success-overlay__row">
              <span class="guest-order-success-overlay__ten-dang-nhap-text">Mã đơn hàng:</span>
              <span class="guest-order-success-overlay__username">{{ orderCode() }}</span>
            </div>
          </div>
        }
        <div class="guest-order-success-overlay__row-2">
          <button
            type="button"
            (click)="handleGoHome()"
            class="btn-yellow px-[22px] py-2 normal-case tracking-[0.46px]"
          >
            <span class="guest-order-success-overlay__tro-ve-trang-text">Trở về trang chủ</span>
          </button>
          <button
            type="button"
            (click)="handleLookup()"
            class="btn-yellow-outline w-[190px] px-[22px] py-2 normal-case tracking-[0.46px]"
          >
            <span class="guest-order-success-overlay__dang-nhap-text">Tra cứu đơn hàng</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
