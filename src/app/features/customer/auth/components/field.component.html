<span>{{ label() }}@if (required()) {
    <span class="text-[#c62828]">*</span>
  }
</span>
<span [class]="`${isSoft() ? 'mt-[6px]' : 'mt-1'} relative block`">
  @if (Icon()) {
    <app-customer-icon
      [name]="Icon()"
      className="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2"
    />
  }
  <input
    [attr.name]="name()"
    [value]="value() ?? ''"
    (input)="onChange.emit($event)"
    [attr.type]="isPassword() && visible() ? 'text' : type()"
    [required]="required()"
    [attr.placeholder]="placeholder()"
    [attr.data-auth-error]="invalid() ? 'true' : undefined"
    [attr.aria-invalid]="invalid() || undefined"
    [class]="[
          isSoft()
            ? 'h-12 w-full rounded-xl border bg-[#FAFEFF] px-4 text-[16px] font-normal text-[#060B16] outline-none transition placeholder:text-[rgba(6,11,22,0.5)]'
            : 'h-[37px] w-full rounded-[6px] border bg-white px-3 text-sm font-normal outline-none transition md:h-[37px]',
          invalid()
            ? 'border-[#c62828] ring-1 ring-[#c62828]'
            : isSoft()
              ? 'border-[#C6DCE3] hover:border-[#90caf9] focus:border-[#0d47a1] focus:ring-1 focus:ring-[#0d47a1]'
              : 'border-[rgba(0,0,0,0.42)] hover:border-[#90caf9] focus:border-[#0d47a1] focus:ring-1 focus:ring-[#0d47a1]',
          Icon() ? 'pl-9' : '',
          isPassword() ? 'pr-10' : ''
        ].join(' ')"
  />
  @if (isPassword()) {
    <button
      type="button"
      (click)="handle1()"
      class="btn-icon-subtle absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-500"
      [attr.aria-label]="visible() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
    >
      @if (visible()) {
        <app-customer-icon name="eye-off" className="size-4" />
      } @else {
        <app-customer-icon name="eye" className="size-4" />
      }
    </button>
  }
</span>
@if (hint()) {
  <span class="mt-1 block text-[11px] font-normal italic text-gray-500">{{ hint() }}</span>
}
@if (invalid()) {
  <span class="mt-1 block text-xs font-normal text-[#c62828]">{{ error() }}</span>
}
