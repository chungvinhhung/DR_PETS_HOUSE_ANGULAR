<div class="otp-form__row">
  @for (digit of otp(); track $index; let index = $index) {
    <input
      #otpInput
      [value]="digit ?? ''"
      (input)="updateOtp(index, $any($event).target.value)"
      (keydown)="handle2($any($event), digit, index)"
      inputmode="numeric"
      [attr.aria-label]="`Số OTP thứ ${index + 1}`"
      class="otp-form__th"
    />
  }
</div>
@if (submitError()) {
  <p class="otp-form__submit-error">{{ submitError() }}</p>
}
<button app-primary-button [disabled]="!complete() || submitting()">
  @if (submitting()) {
    ĐANG XÁC NHẬN...
  } @else {
    XÁC NHẬN
  }
</button>
<p class="otp-form__khong-nhan-duoc-text">Không nhận được mã? <button type="button" class="text-blue-900 disabled:cursor-not-allowed disabled:text-[#7e8085]" [disabled]="resendDisabled()" (click)="handleResend()">{{ resendLabel() }}</button></p>
<button
  type="button"
  (click)="changeScreen()(previousScreen())"
  class="flex items-center justify-center gap-2 text-sm text-[#7e8085]"
>
  <app-customer-icon name="arrow-left" className="size-4" /> Quay lại</button>
