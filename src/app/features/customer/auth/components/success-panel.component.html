<img
  [attr.src]="authImages.logo"
  alt="Dr. Pet's House"
  class="success-panel__dr-pet-s-house"
/>
<div class="success-panel__box">
  <img
    [attr.src]="authImages.successDog"
    alt=""
    class="success-panel__success-dog"
  />
</div>
<div class="success-panel__stack">
  <span class="success-panel__text">
    <app-customer-icon name="check" className="size-12" />
  </span>
  <h1 class="success-panel__dang-ky-thanh-title">Đăng ký thành công!</h1>
  <p class="success-panel__chao-mung-ban-text">Chào mừng bạn đến với <strong>Dr. Pet's House</strong></p>
  <button type="button" (click)="changeScreen()('login')" class="btn-yellow mt-6">ĐĂNG NHẬP NGAY <app-customer-icon name="arrow-right" className="size-5" />
  </button>
  <p class="success-panel__can-ho-tro-text">Cần hỗ trợ? <a href="tel:0900000000" class="success-panel__lien-he-doi-link">Liên hệ đội ngũ chăm sóc</a>
  </p>
</div>
