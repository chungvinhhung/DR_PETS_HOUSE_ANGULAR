<img
  [attr.src]="authImages.logo"
  alt="Dr. Pet's House"
  class="absolute left-[13px] top-[3px] h-[56px] w-[101px] object-contain md:left-6 md:top-5 md:h-[78px] md:w-auto"
/>
<div class="border-[1.903px] border-dashed border-secondary p-[6.344px] md:border-[3px] md:p-2">
  <img
    [attr.src]="authImages.successDog"
    alt=""
    class="h-[222.689px] w-[197.311px] rounded-[7.613px] bg-[#E5F6FD] object-cover md:h-[300px] md:w-[270px]"
  />
</div>
<div class="flex w-full max-w-[425px] flex-col items-center px-5 pt-3 text-center md:px-0">
  <span class="flex size-[74px] items-center justify-center rounded-full bg-[#2e7d32] text-white">
    <app-customer-icon name="check" className="size-12" />
  </span>
  <h1 class="mt-5 text-[20px] font-bold leading-10 md:text-3xl">Đăng ký thành công!</h1>
  <p class="mt-3 text-[16px] leading-[29.25px] md:text-lg">Chào mừng bạn đến với <strong>Dr. Pet's House</strong></p>
  <button type="button" (click)="changeScreen()('login')" class="btn-yellow mt-6">ĐĂNG NHẬP NGAY <app-customer-icon name="arrow-right" className="size-5" />
  </button>
  <p class="mt-6 w-full border-t border-[rgba(206,198,178,0.3)] pt-4 text-sm">Cần hỗ trợ? <a href="tel:0900000000" class="font-semibold text-blue-900">Liên hệ đội ngũ chăm sóc</a>
  </p>
</div>
