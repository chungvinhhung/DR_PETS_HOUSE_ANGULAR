<app-nav-bar />
<main class="not-found-page__main">
  <section class="not-found-page__section">
    <div class="not-found-page__stack">
      <div class="not-found-page__box">
        <div
          class="not-found-page__layer"
          aria-label="404"
        >
          <span class="not-found-page__text">4</span>
          <span class="not-found-page__text">0</span>
          <span class="not-found-page__text">4</span>
        </div>
        <img
          [attr.src]="sleepingPetImage"
          alt=""
          class="not-found-page__sleeping-pet-image"
        />
      </div>
      <img
        [attr.src]="tennisBallImage"
        alt=""
        class="not-found-page__tennis-ball-image"
      />
      <h1 class="not-found-page__title">{{ NOT_FOUND_COPY.title }}</h1>
      <p class="not-found-page__description">{{ NOT_FOUND_COPY.description }}</p>
      <a
        [appCustomerLink]="NOT_FOUND_COPY.homePath"
        class="not-found-page__focus-ring-brand focus-ring-brand"
      >{{ NOT_FOUND_COPY.actionLabel }}</a>
    </div>
  </section>
</main>
<app-footer [variant]="'white'" />
