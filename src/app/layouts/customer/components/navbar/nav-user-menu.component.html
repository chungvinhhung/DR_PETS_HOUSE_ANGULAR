<button
  type="button"
  class="overflow-hidden rounded-full border border-black transition hover:opacity-90"
  aria-label="Menu tài khoản"
  aria-haspopup="true"
>
  <img [attr.src]="avatar()" alt="" class="h-9 w-9 object-cover" />
</button>
<!-- pt-2: vùng đệm để di chuột từ avatar xuống menu không bị mất hover -->
<div class="invisible absolute right-0 top-full z-50 pt-2 opacity-0 transition-all duration-200 group-hover:visible group-hover:opacity-100">
  <div class="min-w-[260px] rounded-2xl border border-gray-100 bg-white p-3 shadow-lg">
    <ul class="space-y-0.5">
      @for (item of USER_MENU_LINKS; track item.label) {
        <li>
          @if (item.children) {
            <div class="group/sub relative">
              <a [appCustomerLink]="item.href" [class]="`${linkClass} pr-8 font-medium`">{{ item.label }}<span
                  class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
                  aria-hidden="true"
                >›</span>
              </a>
              <ul class="invisible absolute right-full top-0 z-10 mr-1 min-w-[220px] rounded-2xl border border-gray-100 bg-white p-3 opacity-0 shadow-lg transition-all duration-200 group-hover/sub:visible group-hover/sub:opacity-100">
                @for (child of item.children; track child.label) {
                  <li><a [appCustomerLink]="child.href" [class]="linkClass">{{ child.label }}</a></li>
                }
              </ul>
            </div>
          } @else {
            <a [appCustomerLink]="item.href" [class]="linkClass">{{ item.label }}</a>
          }
        </li>
      }
    </ul>
    <div class="mt-2 border-t border-gray-100 pt-2">
      <a
        [attr.href]="USER_MENU_LOGOUT.href"
        [class]="`${linkClass} font-medium text-red-600 hover:bg-red-50 hover:text-red-700`"
        (click)="handleLogout($any($event))"
      >{{ USER_MENU_LOGOUT.label }}</a>
    </div>
  </div>
</div>
