<header class="fixed inset-x-0 top-0 z-[70] hidden w-full bg-white lg:block">
  <div class="mx-auto flex max-w-page items-center justify-between gap-2 px-3 py-3 sm:gap-4 sm:px-6 md:px-20">
    <a href="/" class="shrink-0">
      <img
        [attr.src]="homeImages.logo"
        alt="Dr. Pet's House"
        class="h-[52px] w-auto object-contain sm:h-[59px]"
      />
    </a>
    <nav app-nav-links></nav>
    <div class="flex min-w-0 shrink-0 items-center gap-2 sm:gap-3">
      <form app-nav-search-bar [className]="'hidden lg:block'"></form>
      <a href="/dat-lich">
        <app-yellow-button [className]="'h-[35px] min-w-[82px] px-3 py-2 text-[13px] tracking-[0.1px] sm:min-w-[109px] sm:px-[22px] sm:text-base sm:tracking-[0.15px]'">ĐẶT LỊCH</app-yellow-button>
      </a>
      <app-yellow-button
        [variant]="'outline'"
        (onClick)="authService.openAuth('login')"
        [className]="'h-[35px] min-w-[82px] px-3 py-2 text-[13px] tracking-[0.1px] sm:min-w-[109px] sm:px-[22px] sm:text-base sm:tracking-[0.15px]'"
      >ĐĂNG NHẬP</app-yellow-button>
      <button
        type="button"
        (click)="cartService.openCart()"
        class="hidden shrink-0 cursor-pointer border-0 bg-transparent p-0 min-[520px]:block"
        aria-label="Giỏ hàng"
      >
        <img [attr.src]="cartIcon" alt="" class="h-9 w-9" />
      </button>
    </div>
  </div>
</header>
<div class="hidden h-[88px] shrink-0 lg:block" aria-hidden="true"></div>
