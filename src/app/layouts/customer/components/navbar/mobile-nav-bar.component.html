<header class="mobile-nav-bar__header">
  <div class="mobile-nav-bar__row">
    <a appCustomerLink="/" class="mobile-nav-bar__link">
      <img
        [attr.src]="homeImages.logo"
        alt="Dr. Pet's House"
        class="mobile-nav-bar__dr-pet-s-house"
      />
    </a>
    <button app-tablet-search-trigger (onOpen)="activePanel.set('search')"></button>
    <div [class]="`${rightGroupClass()} max-w-[250px] min-w-[120px]`">
      <button
        type="button"
        (click)="activePanel.set('search')"
        class="flex size-[22px] items-center justify-center md:hidden"
        aria-label="Tìm kiếm"
      >
        <img app-search-asset-icon />
      </button>
      @if (isAuthenticated()) {
        <app-notification-bell
          [className]="'inline-flex'"
          [buttonClassName]="'p-0'"
          [iconClassName]="'h-[22px] w-[22px] md:h-[30px] md:w-[30px]'"
          [badgeClassName]="'hidden'"
        />
      }
      <button
        type="button"
        (click)="openMobileCart()"
        class="relative flex size-[22px] items-center justify-center md:size-[30px]"
        aria-label="Giỏ hàng"
      >
        <img
          [attr.src]="isAuthenticated() ? navbarImages.cartYellow : cartIcon"
          alt=""
          class="mobile-nav-bar__cart-icon"
        />
      </button>
      @if (isAuthenticated()) {
        <a
          appCustomerLink="/thong-tin-nguoi-dung"
          class="mobile-nav-bar__tai-khoan"
          aria-label="Tài khoản"
        >
          <img [attr.src]="avatar()" alt="" class="mobile-nav-bar__avatar" />
        </a>
      } @else {
        <button
          type="button"
          (click)="authService.openAuth('login')"
          class="flex h-[22px] w-[76px] items-center justify-center rounded bg-[#FDD835] px-[22px] py-2 shadow-elevation md:h-[30px] md:w-[102px]"
        >
          <span class="mobile-nav-bar__text-black-87 text-black/87">ĐĂNG NHẬP</span>
        </button>
      }
      <button
        type="button"
        (click)="activePanel.set('menu')"
        class="flex h-[22px] w-[21px] items-center justify-center md:h-[40px] md:w-[40px]"
        aria-label="Mở menu"
      >
        <span class="mobile-nav-bar__text"><app-figma-menu-icon /></span>
      </button>
    </div>
  </div>
</header>
<div class="h-12 shrink-0 md:h-16 lg:hidden" aria-hidden="true"></div>
<app-mobile-search-panel [open]="activePanel() === 'search'" (onClose)="closePanel()" />
<app-mobile-menu-panel [open]="activePanel() === 'menu'" (onClose)="closePanel()" />
