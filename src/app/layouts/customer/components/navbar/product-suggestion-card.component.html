<img
  [attr.src]="product().image || searchSuggestionImages.productThumb"
  [attr.alt]="product().name"
  class="size-12 shrink-0 rounded-[8px] object-cover"
/>
<span class="flex min-w-0 flex-1 flex-col items-start">
  <span class="w-full truncate font-['Roboto'] text-[13px] font-normal leading-[19.5px] text-black/87">
    <app-highlighted-text [text]="product().name" [keyword]="query()" />
  </span>
  <span class="w-full truncate font-['Roboto'] text-[12px] font-normal leading-[18px] text-[#0D47A1]">{{ formatVnd(product().price) }}</span>
</span>
