<nav class="flex-1 space-y-2 overflow-y-auto pr-1" [appStyle]="{ scrollbarWidth: 'none' }">
  @for (item of menuItems(); track $index) {
    @let Icon = item.icon;
    @let active = isActive(item.path);
    <div
      (click)="navService.navigate(item.path)"
      [class]="`
              flex items-center gap-4 px-4 py-3 rounded-lg cursor-pointer
              transition-all duration-200 ease-in-out
              ${
                active
                  ? 'bg-[#06105a] text-white shadow-sm'
                  : 'text-[#2e3340] hover:bg-[#d4effa] hover:text-[#06105a]'
              }
            `"
    >
      <app-customer-icon [name]="Icon" className="text-xl w-5 h-5 flex-shrink-0" />
      <span class="font-medium text-[15px] whitespace-nowrap">{{ item.label }}</span>
    </div>
  }
</nav>
<div
  (click)="handleLogout()"
  class="flex items-center gap-4 px-4 py-3 mt-4 rounded-lg cursor-pointer transition-all duration-200 ease-in-out text-[#414753] hover:bg-[#d4effa] flex-shrink-0"
>
  <app-customer-icon name="ant-logout" className="text-xl w-5 h-5 flex-shrink-0" />
  <span class="font-medium text-[15px] whitespace-nowrap">Đăng xuất</span>
</div>
