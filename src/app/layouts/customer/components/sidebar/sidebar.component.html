<nav class="sidebar__let-icon-nav lg:space-y-2" [appStyle]="{ scrollbarWidth: 'none' }">
  @for (item of menuItems(); track $index) {
    @let Icon = item.icon;
    @let active = isActive(item.path);
    <div
      (click)="navService.navigate(item.path)"
      [class]="`
              flex shrink-0 items-center gap-2 lg:gap-4 px-3 lg:px-4 py-2 lg:py-3 rounded-lg cursor-pointer
              transition-all duration-200 ease-in-out
              ${
                active
                  ? 'bg-[#06105a] text-white shadow-sm'
                  : 'text-[#2e3340] hover:bg-[#d4effa] hover:text-[#06105a]'
              }
            `"
    >
      <app-customer-icon [name]="Icon" className="text-xl w-5 h-5 flex-shrink-0" />
      <span class="sidebar__label">{{ item.label }}</span>
    </div>
  }
</nav>
<div
  (click)="handleLogout()"
  class="sidebar__row"
>
  <app-customer-icon name="ant-logout" className="text-xl w-5 h-5 flex-shrink-0" />
  <span class="sidebar__dang-xuat-text">Đăng xuất</span>
</div>
