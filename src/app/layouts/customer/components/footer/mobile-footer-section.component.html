<button
  type="button"
  (click)="onToggle.emit($event)"
  class="flex h-[35px] w-full items-center justify-between text-left"
  [attr.aria-expanded]="open()"
>
  <span class="mobile-footer-section__title">{{ title() }}</span>
  <app-customer-icon
    name="chevron-down"
    [className]="`size-[18px] text-[#0D47A1] transition-transform ${open() ? 'rotate-180' : ''}`"
    [strokeWidth]="1.6"
  />
</button>
@if (open()) {
  <ul class="mobile-footer-section__let-label-list">
    @for (__item1 of links(); track $index) {
      @let label = __item1[0];
      @let to = __item1[1];
      <li class="mobile-footer-section__item">
        @if (label === 'Bảng giá dịch vụ') {
          <button
            type="button"
            (click)="onPricingOpen.emit($event)"
            class="min-w-0 flex-1 truncate text-left font-['Roboto'] text-[11px] font-normal leading-[16.5px] tracking-[0.15px] text-[#1565C0]"
          >{{ label }}</button>
        } @else {
          <a
            [appCustomerLink]="to"
            class="mobile-footer-section__label"
          >{{ label }}</a>
        }
      </li>
    }
  </ul>
}
