<div class="mobile-footer__stack">
  @for (section of sections(); track section.id) {
    <section
      app-mobile-footer-section
      [title]="section.title"
      [links]="section.links"
      [open]="openSection() === section.id"
      (onToggle)="handle1(section)"
      (onPricingOpen)="onPricingOpen.emit($event)"
    ></section>
  }
</div>
<div class="mobile-footer__stack-2">
  <div class="mobile-footer__stack-3">
    <div class="mobile-footer__stack-4">
      <div class="mobile-footer__stack-5">
        <a appCustomerLink="/" aria-label="Dr. Pet's House - Trang chủ">
          <img [attr.src]="homeImages.logo" alt="Dr. Pet's House" class="mobile-footer__dr-pet-s-house" />
        </a>
        <p class="mobile-footer__trung-tam-cham-text">TRUNG TÂM CHĂM SÓC THÚ CƯNG</p>
        <p class="mobile-footer__cung-cap-dich-text">Cung cấp dịch vụ khám bệnh, làm đẹp, và mua sắm sản phẩm cho thú cưng của bạn.</p>
      </div>
    </div>
    <div class="mobile-footer__row">
      <div app-mobile-social-links></div>
      <a
        href="tel:0868686868"
        class="mobile-footer__link"
      >
        <img [attr.src]="homeImages.phone" alt="" class="mobile-footer__phone" />
        <span class="mobile-footer__text">0868686868</span>
      </a>
    </div>
  </div>
</div>
<div class="mobile-footer__layer">
  <p class="mobile-footer__text-2">© 2026 Dr.Pet's House. Bản quyền thuộc về Dr.Pet's House.</p>
</div>
