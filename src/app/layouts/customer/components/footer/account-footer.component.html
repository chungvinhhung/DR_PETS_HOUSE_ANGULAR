<div class="account-footer__row">
  <p class="account-footer__text">© 2026 Dr.Pet's House. Bản quyền thuộc về Dr.Pet's House.</p>
  <nav
    aria-label="Liên kết chân trang tài khoản"
    class="account-footer__lien-ket-chan-trang"
  >
    @for (__item1 of LEGAL_LINKS; track $index) {
      @let label = __item1[0];
      @let to = __item1[1];
      <a [appCustomerLink]="to" class="account-footer__label">{{ label }}</a>
    }
  </nav>
</div>
