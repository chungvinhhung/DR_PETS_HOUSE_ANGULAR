<div class="customer-root">
  @if (stylesReady()) {
    <router-outlet />
    <app-customer-back-to-top />

    <!-- Popup dùng chung toàn site (trước đây được render trong các Provider của React) -->
    <app-auth-modal />
    <app-cart-drawer />
    <app-checkout-overlay />
    <app-bank-transfer-modal />
    <app-order-success-overlay />
    <app-guest-order-success-overlay />
    <app-decision-modal />
  } @else {
    <div role="status" class="customer-style-loading" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#e5f6fd;color:#0d47a1;font-family:Arial,sans-serif;padding:24px;text-align:center">
      <p style="font-size:16px;font-weight:600;margin:0">Đang chuẩn bị giao diện Dr. Pet's House...</p>
      <button type="button" (click)="retryCustomerStylesheet()"
        style="background:#0d47a1;color:white;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px">
        Tải lại giao diện
      </button>
    </div>
  }
</div>
