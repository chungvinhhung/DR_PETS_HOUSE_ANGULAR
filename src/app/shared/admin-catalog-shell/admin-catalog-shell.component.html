<div class="catalog-shell">
  <header class="catalog-header">
    <a class="catalog-header__brand" routerLink="/admin/dashboard" aria-label="Dr. Pet's House — Admin Dashboard">
      <img src="/assets/admin-product/logo-user.webp" alt="Dr. Pet's House" width="166" height="72">
    </a>

    <div class="catalog-header__actions">
      <a routerLink="/" class="catalog-header__view-site">Xem trang web</a>
      <img class="catalog-header__notification" src="/assets/admin-product/icon-notification.svg" alt="Thông báo" width="41" height="41">
      <a routerLink="/admin/profile" class="catalog-header__profile" aria-label="Xem hồ sơ quản trị viên">
        <img class="catalog-header__avatar" src="/assets/admin-product/avatar-figma.png" alt="" width="36" height="36">
        <span class="catalog-header__identity">Quản trị viên<small>Tên tài khoản</small></span>
        <img class="catalog-header__chevron" src="/assets/admin-product/expand_more.svg" alt="" aria-hidden="true" width="16" height="16">
      </a>
    </div>
  </header>

  <div class="catalog-layout">
    <aside class="catalog-sidebar">
      <nav aria-label="Điều hướng quản trị">
        <a class="catalog-sidebar__link" routerLink="/admin/dashboard">
          <img src="/assets/admin-product/icon-dashboard.svg" alt="" width="20" height="20">
          Dashboard
        </a>

        <button type="button" class="catalog-sidebar__group"
          [class.catalog-sidebar__group--active]="activeItem === 'categories' || activeItem === 'products'"
          [attr.aria-expanded]="salesExpanded" aria-controls="admin-sales-submenu"
          (click)="toggleSales()">
          <img src="/assets/admin-product/icon-sales.svg" alt="" width="20" height="20">
          <span>Bán hàng</span>
          <img class="catalog-sidebar__group-chevron"
            [src]="salesExpanded ? '/assets/admin-product/expand_less.svg' : '/assets/admin-product/expand_more.svg'"
            alt="" aria-hidden="true" width="16" height="16">
        </button>

        <div id="admin-sales-submenu" class="catalog-sidebar__children"
          [hidden]="!salesExpanded" aria-label="Các mục thuộc Bán hàng">
          <a class="catalog-sidebar__sub" routerLink="/admin/categories"
            [class.catalog-sidebar__sub--active]="activeItem === 'categories'"
            [attr.aria-current]="activeItem === 'categories' ? 'page' : null">
            Danh mục sản phẩm
          </a>
          <a class="catalog-sidebar__sub" routerLink="/admin/products"
            [class.catalog-sidebar__sub--active]="activeItem === 'products'"
            [attr.aria-current]="activeItem === 'products' ? 'page' : null">
            Sản phẩm
          </a>
          <a class="catalog-sidebar__sub" routerLink="/admin/orders">Đơn hàng</a>
          <span class="catalog-sidebar__sub">Khuyến mãi</span>
        </div>

        <button type="button" class="catalog-sidebar__group"
          [class.catalog-sidebar__group--active]="activeItem === 'services'"
          [attr.aria-expanded]="servicesExpanded" aria-controls="admin-services-submenu"
          (click)="toggleServices()">
          <img src="/assets/admin-product/icon-services.svg" alt="" width="20" height="20">
          <span>Dịch vụ</span>
          <img class="catalog-sidebar__group-chevron"
            [src]="servicesExpanded ? '/assets/admin-product/expand_less.svg' : '/assets/admin-product/expand_more.svg'"
            alt="" aria-hidden="true" width="16" height="16">
        </button>
        <div id="admin-services-submenu" class="catalog-sidebar__children"
          [class.catalog-sidebar__children--services]="activeItem === 'services'"
          [hidden]="!servicesExpanded" aria-label="Các mục thuộc Dịch vụ">
          <a class="catalog-sidebar__sub" routerLink="/admin/services"
            [class.catalog-sidebar__sub--active]="activeItem === 'services'"
            [attr.aria-current]="activeItem === 'services' ? 'page' : null">
            Danh mục dịch vụ
          </a>
          <a class="catalog-sidebar__sub" routerLink="/admin/appointments">Lịch hẹn</a>
        </div>

        <button type="button" class="catalog-sidebar__group"
          [class.catalog-sidebar__group--active]="activeItem === 'branches'"
          [attr.aria-expanded]="operationsExpanded" aria-controls="admin-operations-submenu"
          (click)="toggleOperations()">
          <img src="/assets/admin-product/icon-operations.svg" alt="" width="20" height="20">
          <span>Vận hành</span>
          <img class="catalog-sidebar__group-chevron"
            [src]="operationsExpanded ? '/assets/admin-product/expand_less.svg' : '/assets/admin-product/expand_more.svg'"
            alt="" aria-hidden="true" width="16" height="16">
        </button>
        <div id="admin-operations-submenu" class="catalog-sidebar__children catalog-sidebar__children--services"
          [hidden]="!operationsExpanded" aria-label="Các mục thuộc Vận hành">
          <a class="catalog-sidebar__sub" routerLink="/admin/branches"
            [class.catalog-sidebar__sub--active]="activeItem === 'branches'"
            [attr.aria-current]="activeItem === 'branches' ? 'page' : null">
            Chi nhánh
          </a>
        </div>
        <a class="catalog-sidebar__link" routerLink="/admin/users">
          <img src="/assets/admin-product/icon-users.svg" alt="" width="20" height="20">
          Quản lý người dùng
        </a>
        <div class="catalog-sidebar__link">
          <img src="/assets/admin-product/icon-content.svg" alt="" width="20" height="20">
          Nội dung &amp; Cộng đồng
        </div>
        <div class="catalog-sidebar__link">
          <img src="/assets/admin-product/icon-reviews.svg" alt="" width="20" height="20">
          Đánh giá &amp; Phản hồi
        </div>
      </nav>
    </aside>
    <div class="catalog-layout__content">
      <ng-content />
    </div>
  </div>
</div>
