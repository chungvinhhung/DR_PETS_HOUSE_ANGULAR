<ol class="customer-breadcrumb__list" [class.customer-breadcrumb__list--blog]="isBlog()" [class]="listClassName()">
  @for (item of items() || []; track $index; let index = $index) {
    @let isCurrent = index === items().length - 1;
    <li class="customer-breadcrumb__item" [class.customer-breadcrumb__item--current]="isCurrent">
      @if (index > 0) {
        <svg class="customer-breadcrumb__chevron" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      }
      @if (item.to && !isCurrent) {
        <a [appCustomerLink]="item.to" class="customer-breadcrumb__link"
          [class]="linkClassName()" [title]="item.label">{{ item.label }}</a>
      } @else {
        <span class="customer-breadcrumb__current" [class]="currentClassName()"
          [title]="item.label" [attr.aria-current]="isCurrent ? 'page' : null">{{ item.label }}</span>
      }
    </li>
  }
</ol>
