<a [appCustomerLink]="href()" class="blog-card__media">
  <img [attr.src]="post().image" alt="" class="blog-card__image" />
  <span app-category-badge [category]="post().category" [label]="post().categoryLabel"></span>
</a>
<div class="blog-card__body">
  <a [appCustomerLink]="href()"><h3 class="blog-card__title">{{ post().title }}</h3></a>
  <p class="blog-card__excerpt">{{ post().excerpt }}</p>
  <div class="blog-card__footer">
    <span class="blog-card__date">
      <app-customer-icon name="calendar-days" className="h-3 w-3" />{{ post().publishedAt }}</span>
    <a [appCustomerLink]="href()" class="blog-card__read-more">Đọc tiếp <app-customer-icon
        name="arrow-right"
        className="h-3 w-3 transition-transform group-hover:translate-x-1"
      />
    </a>
  </div>
</div>
