@if (productHref()) {
  <a [appCustomerLink]="productHref()" [class]="`group block ${cardClass()}`">
    <div class="product-card__box">
      <img
        [attr.src]="productImage()"
        [attr.alt]="productName()"
        class="product-card__product-name group-hover:scale-[1.03]"
      />
    </div>
    <div class="product-card__box-2">
      <p class="product-card__name product-card-name group-hover:text-blue-900 text-black">{{ productName() }}</p>
      <div class="product-card__price-row product-card-price-row">
        <span class="product-card__product-old-price">{{ productOldPrice() }}</span>
        <span class="product-card__current-price product-card-current-price">{{ productPrice() }}</span>
      </div>
      <div class="product-card__box-3"><app-product-rating [value]="productRating()" /></div>
    </div>
    <button
      type="button"
      class="card-product-cart-btn"
      [attr.aria-label]="`Thêm ${productName()} vào giỏ hàng`"
      (click)="handle1($any($event))"
    >
      <img [attr.src]="productCardImages.cartBadge" alt="" class="product-card__cart-badge" />
    </button>
    @if (isTag()) {
      <div class="product-card__layer">
        <span class="product-card__product-tag-label">{{ productTagLabel() }}</span>
      </div>
    }
  </a>
} @else {
  <article [class]="`group ${cardClass()}`">
    <div class="product-card__box">
      <img
        [attr.src]="productImage()"
        [attr.alt]="productName()"
        class="product-card__product-name group-hover:scale-[1.03]"
      />
    </div>
    <div class="product-card__box-2">
      <p class="product-card__name product-card-name group-hover:text-blue-900 text-black">{{ productName() }}</p>
      <div class="product-card__price-row product-card-price-row">
        <span class="product-card__product-old-price">{{ productOldPrice() }}</span>
        <span class="product-card__current-price product-card-current-price">{{ productPrice() }}</span>
      </div>
      <div class="product-card__box-3"><app-product-rating [value]="productRating()" /></div>
    </div>
    <button
      type="button"
      class="card-product-cart-btn"
      [attr.aria-label]="`Thêm ${productName()} vào giỏ hàng`"
      (click)="handle2($any($event))"
    >
      <img [attr.src]="productCardImages.cartBadge" alt="" class="product-card__cart-badge" />
    </button>
    @if (isTag()) {
      <div class="product-card__layer">
        <span class="product-card__product-tag-label">{{ productTagLabel() }}</span>
      </div>
    }
  </article>
}
