<div
  class="scaled-canvas-layout__box"
  [ngStyle]="{ 'width.px': designWidth() * scale(), height: scaledHeight() !== null ? scaledHeight() + 'px' : 'auto' }"
>
  <div
    #innerRef
    [class]="className()"
    [ngStyle]="{
      'width.px': designWidth(),
      transform: 'scale(' + scale() + ')',
      'transform-origin': 'top left',
      'will-change': 'transform',
      'backface-visibility': 'hidden'
    }"
  >
    <ng-content />
  </div>
</div>
