@if (state().open) {
  <div
    class="decision-modal__backdrop"
    role="dialog"
    aria-modal="true"
    (click)="decisionModal.close()"
  >
    <div
      class="decision-modal__dialog relative w-full max-w-[460px] h-auto rounded-[28px] bg-white px-7 pt-10 pb-8 text-center shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <!-- Nút đóng góc trên bên phải -->
      <button
        type="button"
        aria-label="Đóng"
        class="absolute right-5 top-5 flex h-8 w-8 items-center justify-center rounded-full text-zinc-400 transition hover:bg-zinc-100 hover:text-zinc-600"
        (click)="decisionModal.close()"
      >
        ✕
      </button>

        <!-- Hình minh họa -->
      @if (state().image) {
        <div class="decision-modal__illustration">
          <img [src]="state().image" alt="Minh họa xác nhận" />
          <span class="decision-modal__illustration-warning">!</span>
        </div>
      } @else {
        <div class="mb-5 flex justify-center">
          <div app-warning-mark></div>
        </div>
      }
      <!-- Tiêu đề (tự xuống dòng mượt mà, không bị đè chữ) -->
      <h2 class="decision-modal__title mb-3 text-[22px] sm:text-[24px] font-extrabold uppercase leading-snug tracking-tight text-zinc-800">
        {{ state().title }}
      </h2>

      <!-- Nội dung mô tả -->
      <p class="decision-modal__message mb-7 text-[15px] leading-relaxed text-zinc-600">
        {{ state().message }}
        @if (state().messageBold) {
          <strong class="font-bold text-zinc-900">{{ state().messageBold }}</strong>
        }
        {{ state().messageSuffix }}
      </p>

      <!-- Cụm 2 nút bấm nằm gọn bên trong khung trắng -->
      <div class="decision-modal__actions grid w-full grid-cols-2 gap-3.5">
        <button
          type="button"
          class="decision-modal__btn border border-zinc-300 bg-white text-zinc-700 hover:bg-zinc-50"
          (click)="decisionModal.cancel()"
        >
          {{ state().cancelLabel || 'Quay lại' }}
        </button>

        <button
          type="button"
          class="decision-modal__btn font-semibold"
          [class]="hasYellowActions()
            ? 'bg-[#fff176] text-[#031635] hover:bg-[#fdd835]'
            : 'bg-[#dc2626] text-white hover:bg-[#b91c1c]'"
          (click)="decisionModal.confirm()"
        >
          {{ state().confirmLabel || 'Xác nhận' }}
        </button>
      </div>
    </div>
  </div>
}
