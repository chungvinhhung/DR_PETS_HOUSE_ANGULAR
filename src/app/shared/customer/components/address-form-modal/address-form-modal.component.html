<section
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title()"
  class="address-modal"
>
  <div class="address-modal__panel">
    <header class="address-modal__header">
      <app-customer-icon name="map-pin" className="h-5 w-4 shrink-0 text-[#00355f]" [strokeWidth]="2" />
      <h2 class="address-modal__title">{{ title() }}</h2>
      <button
        type="button"
        (click)="onClose.emit($event)"
        aria-label="Đóng"
        class="btn-icon-subtle address-modal__close"
      >
        <app-customer-icon name="x" className="size-[18px]" [strokeWidth]="1.6" />
      </button>
    </header>
    <form novalidate (submit)="handleSubmit($any($event))" class="address-modal__form">
      <div class="address-modal__fields">
        <label
          app-address-form-field
          [label]="'Họ tên'"
          [required]="true"
          [autoFocus]="true"
          [autoComplete]="'name'"
          [showError]="validationAttempted()"
          [value]="form().name"
          (onChange)="updateField('name', $any($event).target.value)"
        ></label>
        <label
          app-address-form-field
          [label]="'Số điện thoại'"
          [required]="true"
          [type]="'tel'"
          [autoComplete]="'tel'"
          [showError]="validationAttempted()"
          [value]="form().phone"
          (onChange)="updateField('phone', $any($event).target.value)"
        ></label>
        <label
          app-address-form-field
          [label]="'Email'"
          [type]="'email'"
          [autoComplete]="'email'"
          [value]="form().email"
          (onChange)="updateField('email', $any($event).target.value)"
        ></label>
        <label
          app-address-form-field
          [label]="'Quốc gia'"
          [required]="true"
          [autoComplete]="'country-name'"
          [showError]="validationAttempted()"
          [value]="form().country"
          (onChange)="updateField('country', $any($event).target.value)"
        ></label>
        <label
          app-address-form-field
          [label]="'Địa chỉ cụ thể'"
          [required]="true"
          [autoComplete]="'street-address'"
          [showError]="validationAttempted()"
          [value]="form().address"
          (onChange)="updateField('address', $any($event).target.value)"
          [className]="'sm:col-span-2'"
        ></label>
        <label
          app-address-form-field
          [label]="'Tỉnh/Thành phố'"
          [required]="true"
          [autoComplete]="'address-level1'"
          [showError]="validationAttempted()"
          [value]="form().city"
          [options]="vietnamProvinces"
          [listId]="'vietnam-provinces-list'"
          (onChange)="updateField('city', $any($event).target.value)"
          [className]="'sm:col-span-2'"
        ></label>
      </div>
      <button
        type="submit"
        class="address-modal__submit"
      >Lưu</button>
    </form>
  </div>
</section>
