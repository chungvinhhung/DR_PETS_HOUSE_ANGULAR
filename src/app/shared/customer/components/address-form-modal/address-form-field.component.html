<span class="address-field__label">{{ label() }}@if (required()) {
    <span class="address-field__required">*</span>
  }
</span>
<input
  [attr.autofocus]="autoFocus()"
  [attr.autocomplete]="autoComplete()"
  [attr.list]="listId()"
  (input)="onChange.emit($event)"
  [attr.type]="type()"
  [value]="value() ?? ''"
  [required]="required()"
  [attr.data-address-error]="invalid() ? 'true' : undefined"
  class="address-field__input"
  [class.address-field__input--invalid]="invalid()"
  [class.address-field__input--default]="!invalid()"
/>
@if (options() && listId()) {
  <datalist [id]="listId()!">
    @for (opt of options()!; track opt) {
      <option [value]="opt"></option>
    }
  </datalist>
}
@if (invalid()) {
  <span class="address-field__error">Vui lòng điền thông tin</span>
}
