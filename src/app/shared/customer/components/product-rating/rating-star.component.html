<span class="relative inline-flex shrink-0" [appStyle]="{ width: size(), height: size() }" aria-hidden="true">
  <app-customer-icon
    name="star"
    [size]="size()"
    [strokeWidth]="2"
    className="absolute inset-0"
    [color]="emptyColor()"
    fill="transparent"
  />
  <span class="rating-star__text" [appStyle]="{ width: `${fillPercent()}%` }">
    <app-customer-icon
      name="star"
      [size]="size()"
      [strokeWidth]="2"
      [color]="fillColor()"
      [fill]="fillColor()"
      [svgStyle]="{ minWidth: size() }"
    />
  </span>
</span>
