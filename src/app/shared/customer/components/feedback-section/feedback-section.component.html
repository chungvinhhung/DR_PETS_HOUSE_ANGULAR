<img [attr.src]="shopImages.feedbackBg" alt="" class="feedback-section__feedback-bg" />
<div class="feedback-section__box">
  <h2 class="feedback-section__phan-hoi-cua-title" [appStyle]="styles1()">Phản hồi của khách hàng</h2>
  <div class="feedback-section__box-2">
    <div
      [class]="`grid h-full grid-cols-3 items-stretch gap-[10px] ${slideOffset()}`"
      role="tabpanel"
      aria-live="polite"
      [attr.aria-label]="`Trang ${pageIndex() + 1} / ${FEEDBACK_PAGE_COUNT}`"
    >
      @for (review of FEEDBACK_PAGES[pageIndex()]; track review.id) {
        <article app-feedback-card [review]="review"></article>
      }
    </div>
  </div>
  <div
    class="feedback-section__chon-trang-phan-hoi"
    role="tablist"
    aria-label="Chọn trang phản hồi"
  >
    <button
      type="button"
      (click)="goPrev()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100 disabled:opacity-30"
      aria-label="Trang phản hồi trước"
    >
      <img [attr.src]="shopImages.feedbackCarouselLeft" alt="" class="feedback-section__feedback-carousel-left" />
    </button>
    <div class="feedback-section__row">
      @for (_ of range2(); track $index; let idx = $index) {
        <button
          app-feedback-dot
          [pageIndex]="idx"
          [totalPages]="FEEDBACK_PAGE_COUNT"
          [isActive]="idx === pageIndex()"
          (onClick)="goToPage(idx)"
        ></button>
      }
    </div>
    <button
      type="button"
      (click)="goNext()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100 disabled:opacity-30"
      aria-label="Trang phản hồi tiếp"
    >
      <img [attr.src]="shopImages.feedbackCarouselRight" alt="" class="feedback-section__feedback-carousel-left" />
    </button>
  </div>
</div>
<img
  [attr.src]="shopImages.feedbackPawSmall"
  alt=""
  class="feedback-section__feedback-paw-small"
/>
<img
  [attr.src]="shopImages.feedbackPawSmall"

/>

/>

  [attr.src]="shopImages.feedbackPawBlue"

/>
<img
