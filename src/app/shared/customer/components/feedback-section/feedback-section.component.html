<img [attr.src]="shopImages.feedbackBg" alt="" class="absolute inset-0 h-full w-full object-cover" />
<div class="relative z-10 px-[120px] pt-10">
  <h2 class="text-center text-[#02000F]" [appStyle]="styles1()">Phản hồi của khách hàng</h2>
  <div class="relative mt-[58px] h-[280px] overflow-hidden">
    <div
      [class]="`grid h-full grid-cols-3 items-stretch gap-[10px] ${slideOffset()}`"
      role="tabpanel"
      aria-live="polite"
      [attr.aria-label]="`Trang ${pageIndex() + 1} / ${FEEDBACK_PAGE_COUNT}`"
    >
      @for (review of FEEDBACK_PAGES[pageIndex()]; track review.id) {
        <article app-feedback-card [review]="review"></article>
      }
    </div>
  </div>
  <div
    class="mt-[58px] flex items-center justify-center gap-[21px]"
    role="tablist"
    aria-label="Chọn trang phản hồi"
  >
    <button
      type="button"
      (click)="goPrev()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100 disabled:opacity-30"
      aria-label="Trang phản hồi trước"
    >
      <img [attr.src]="shopImages.feedbackCarouselLeft" alt="" class="h-[10px] w-[271px] object-contain" />
    </button>
    <div class="flex items-center gap-[21px]">
      @for (_ of range2(); track $index; let idx = $index) {
        <button
          app-feedback-dot
          [pageIndex]="idx"
          [totalPages]="FEEDBACK_PAGE_COUNT"
          [isActive]="idx === pageIndex()"
          (onClick)="goToPage(idx)"
        ></button>
      }
    </div>
    <button
      type="button"
      (click)="goNext()"
      class="btn-icon-subtle flex shrink-0 items-center justify-center rounded-lg p-1 opacity-80 transition-opacity hover:opacity-100 disabled:opacity-30"
      aria-label="Trang phản hồi tiếp"
    >
      <img [attr.src]="shopImages.feedbackCarouselRight" alt="" class="h-[10px] w-[271px] object-contain" />
    </button>
  </div>
</div>
