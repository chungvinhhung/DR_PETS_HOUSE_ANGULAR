<div class="coupon-input__field">
  <div class="coupon-input__box">
    <input
      type="text"
      [value]="value() ?? ''"
      (input)="onChange.emit($any($event).target.value.toUpperCase())"
      placeholder="Nhập mã giảm giá"
      class="coupon-input__control"
    />
  </div>
  @if (error()) {
    <p class="coupon-input__error">{{ error() }}</p>
  }
</div>
<button
  type="button"
  (click)="onApply.emit($event)"
  class="coupon-input__apply"
>
  <span class="coupon-input__apply-label">Áp dụng</span>
</button>
