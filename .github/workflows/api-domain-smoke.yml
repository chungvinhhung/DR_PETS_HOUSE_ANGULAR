name: API Domain Smoke Test

# Run on demand after changing custom-domain DNS. Checks do not use credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Check new API domain without credentials
        shell: bash
        run: |
          echo "## API connectivity (unauthenticated)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for path in /api/v1/health /api/v1/orders /api/v1/vouchers; do
            url="https://api.drpetshouse.lat${path}"
            if code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 25 "$url"); then
              echo "${path}: HTTP ${code}"
              echo "- \`${path}\`: HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${path}: Unable to connect"
              echo "- \`${path}\`: connection failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Compare previous Render host" >> "$GITHUB_STEP_SUMMARY"
          if oldcode=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 25 "https://pet-clinic-backend-a4lj.onrender.com/api/v1/vouchers"); then
            echo "Previous Render voucher API: HTTP ${oldcode}"
            echo "- Previous Render voucher API: HTTP ${oldcode}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Previous Render voucher API: unable to connect"
            echo "- Previous Render voucher API: unable to connect" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Public resolver checks" >> "$GITHUB_STEP_SUMMARY"
          for server in 1.1.1.1 8.8.8.8; do
            echo "Resolver ${server}: $(dig +time=3 +tries=1 +short @"${server}" api.drpetshouse.lat A | tr '\n' ' ')" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "HTTP 401/403 indicates a reachable protected API; this test cannot confirm records without Admin authentication." >> "$GITHUB_STEP_SUMMARY"
